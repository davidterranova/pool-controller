# The touch panel's entities, as docs/plans/s3-panel.md's « Contract » names them, for the mock only
# (mock_server.py --panel): what the page's « Screen » section (« Écran ») draws against until local-panel.yaml
# exists. Once it does, --panel loads local-panel.yaml instead and this file is unused: delete it then.
# Never included by a firmware build.

web_server:
  sorting_groups:
    - id: grp_panel
      name: "Screen"
      sorting_weight: 55

select:
  - platform: template
    name: "Panel Language"
    id: panel_lang_select
    web_server: {sorting_group_id: grp_panel, sorting_weight: 10}
    icon: mdi:translate
    entity_category: config
    # Codes; the page shows each language's own name.
    options: ["en", "fr", "es"]
    initial_option: "en"

number:
  - platform: template
    name: "Panel Sleep After"
    id: panel_sleep_number
    web_server: {sorting_group_id: grp_panel, sorting_weight: 20}
    icon: mdi:sleep
    entity_category: config
    unit_of_measurement: s
    mode: box
    min_value: 15
    max_value: 600
    step: 15
    initial_value: 60

sensor:
  - platform: template
    name: "Panel Ignored Touches"
    id: panel_ignored_touches
    web_server: {sorting_group_id: grp_panel, sorting_weight: 30}
    icon: mdi:gesture-tap
    entity_category: diagnostic
    accuracy_decimals: 0
