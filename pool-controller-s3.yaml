# The pool controller on an ESP32-S3 with a touch panel
# (docs/plans/s3-panel.md): the second build target, beside the ESP32-WROOM's
# pool-controller.yaml. `make validate-s3`, `make build-s3`, `make flash-s3`,
# `make ota-s3`, `make logs-s3` (the Makefile); BENCH=1 builds it as the bench
# device, pool-panel-bench.
#
# The firmware is pool-controller.yaml's, included whole as a package, so
# every 1.x change to it reaches this build and the WROOM's files stay
# untouched. This file only overrides what differs on the S3 board:
#   - the name (device_name), so a bench board never clashes with the
#     controller in place, and its own build directory;
#   - the chip: an ESP32-S3-DevKitC-1 N16R8 (16 MB flash, 8 MB octal PSRAM),
#     its framework, and the WROOM-only advanced options removed (`!remove`);
#   - the pins (the plan's pin map), as substitutions over the WROOM's;
#   - firmware updates: off until the S3 build has its own manifest (S12), so
#     a bench board never installs anything by itself;
# and adds the panel (local-panel.yaml) and its hardware (the block at the
# end): the display, the touch controller, the backlight, the Auto button,
# and the Wi-Fi as the panel reads it.
#
# Packages are merged under this file: a key set here replaces the package's,
# `!remove` deletes it, and a list entry `id: !extend <id>` is merged into the
# package's entry with that id (a plain `id:` would add a second one).

substitutions:
  # The ESPHome name, hostname (<device_name>.local) and hotspot. `make … BENCH=1`
  # passes `-s device_name pool-panel-bench`. Keep the default for the board
  # that runs the pool, so Home Assistant keeps the controller's entity ids.
  device_name: pool-controller

  # Pin map (docs/plans/s3-panel.md « Hardware »). Never 0, 3, 45, 46 (boot
  # straps), 19, 20 (USB), 26–37 (flash and octal PSRAM), 43, 44 (serial log).
  # The WROOM's, overridden:
  relay_v1_pin: GPIO4     # Relay 1 -> pump DI1 (Speed V1)
  relay_v2_pin: GPIO5     # Relay 2 -> pump DI2 (Speed V2)
  relay_v3_pin: GPIO6     # Relay 3 -> pump DI3 (Speed V3)
  relay_run_pin: GPIO7    # Relay 4 -> pump DI4 (Run/Stop)
  onewire_pin: GPIO15
  water_meter_pin: GPIO16 # the WROOM's GPIO33 is an octal-PSRAM pin on the S3
  # The S3's own (the display's, wired in S6; the Auto button's, in S2):
  display_sck_pin: GPIO12
  display_mosi_pin: GPIO11
  display_cs_pin: GPIO10
  display_dc_pin: GPIO9
  display_reset_pin: GPIO8
  backlight_pin: GPIO14
  touch_sda_pin: GPIO1
  touch_scl_pin: GPIO2
  touch_int_pin: GPIO21
  touch_reset_pin: GPIO18
  auto_button_pin: GPIO17

packages:
  core: !include pool-controller.yaml
  # The touch panel: its screens, fonts and entities. It names its hardware
  # by id only (the block at the end of this file), so the preview
  # (tools/panel-preview/) builds the same file against stand-ins.
  panel: !include local-panel.yaml

esphome:
  name: ${device_name}
  # .esphome/build/pool-controller-s3/ (the path is relative to .esphome/),
  # not .esphome/build/<name>/ as pool-controller.yaml's: the WROOM's build
  # stays apart, whatever device_name is.
  build_path: build/pool-controller-s3

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 16MB
  framework:
    type: esp-idf
    advanced:
      # The WROOM's: an ESP32 chip revision, and its SRAM1 layout.
      minimum_chip_revision: !remove
      sram1_as_iram: !remove

psram:
  mode: octal
  speed: 80MHz

wifi:
  ap:
    # pool-controller.yaml's hotspot is « pool-controller »: the bench board's
    # gets its own name.
    ssid: ${device_name}

# Updates off until S12 publishes the S3 build and its manifest: Auto Update
# off and Update Check Interval `on_request` for a board that has saved no
# choice (updates.yaml's globals; their ids, so their NVS keys, are the same).
# Should a check run anyway, the update entity only takes a manifest build
# whose chipFamily is ESP32-S3, and the WROOM's manifest has none.
globals:
  - id: !extend auto_update_enabled
    initial_value: 'false'
  - id: !extend update_check_hours
    initial_value: '0'

# The panel's entities in the page's « Screen » group (« Écran »): here, so the
# preview's host build (no web server) includes local-panel.yaml as it is.
web_server:
  sorting_groups:
    - id: grp_panel
      name: "Screen"
      sorting_weight: 55

select:
  - id: !extend panel_language
    web_server: {sorting_group_id: grp_panel, sorting_weight: 10}

number:
  - id: !extend panel_sleep_after
    web_server: {sorting_group_id: grp_panel, sorting_weight: 20}

# --- The S3's hardware block: what local-panel.yaml names by id ---------------
# Written from Elecrow's drawing (DLS30035B1) and the pin map; S6 corrects the
# rotation, the touch transform and the bus speed on the screen. Until S6 the
# display's pins are unconnected: the firmware draws to nothing, and the touch
# controller doesn't answer (its setup fails, the rest runs).

spi:
  - id: panel_spi
    clk_pin: ${display_sck_pin}
    mosi_pin: ${display_mosi_pin}
    # No MISO: the module's SDO stays unconnected (nothing is read back).

display:
  - platform: mipi_spi
    id: panel_display
    model: ST7796
    spi_id: panel_spi
    cs_pin: ${display_cs_pin}
    dc_pin: ${display_dc_pin}
    reset_pin: ${display_reset_pin}
    data_rate: 40MHz
    # The IPS panel shows inverted colours without it (S6: the light theme
    # came out black).
    invert_colors: true
    # Landscape, 480×320 (the panel is 320×480 portrait), turned by the
    # controller itself: LVGL won't take a display `rotation:`. Seen on the
    # bench (S6): the header pins on the left, viewed from the front. The
    # other way up is mirror_x and mirror_y both true (and the touch's
    # mirror_x true, mirror_y false).
    dimensions:
      width: 480
      height: 320
    transform:
      swap_xy: true
      mirror_x: false
      mirror_y: false
    # LVGL draws the screen; its buffer goes in PSRAM.
    auto_clear_enabled: false
    update_interval: never

i2c:
  - id: panel_i2c
    sda: ${touch_sda_pin}
    scl: ${touch_scl_pin}

touchscreen:
  - platform: ft63x6
    id: panel_touch
    i2c_id: panel_i2c
    display: panel_display
    interrupt_pin: ${touch_int_pin}
    reset_pin: ${touch_reset_pin}
    # The glass reports the panel's native portrait (x 0-320, y 0-480);
    # turned like the display (swap first, then mirror): x = raw y,
    # y = 320 - raw x. Measured on the bench (S6).
    transform:
      swap_xy: true
      mirror_y: true

output:
  - platform: ledc
    id: panel_backlight_output
    pin: ${backlight_pin}
    frequency: 20kHz

light:
  # The backlight, internal: the panel lights it on wake and turns it off on
  # sleep (Panel Sleep After).
  - platform: monochromatic
    id: panel_backlight
    output: panel_backlight_output
    internal: true
    restore_mode: ALWAYS_ON
    default_transition_length: 250ms

binary_sensor:
  # The Auto button: a press sets Manual Override to Auto, whatever the panel
  # does (asleep, fogged, unplugged). local-panel.yaml also wakes the screen
  # on it. Pressed = pulled to GND.
  - platform: gpio
    id: auto_button
    internal: true
    pin:
      number: ${auto_button_pin}
      mode:
        input: true
        pullup: true
      inverted: true
    filters:
      - delayed_on: 30ms
      - delayed_off: 30ms
    on_press:
      - lambda: 'ESP_LOGI("panel", "Auto button: Manual Override %s -> Auto", id(manual_override).current_option().c_str());'
      - select.set:
          id: manual_override
          option: "Auto"

# The Wi-Fi as the panel shows it (status bar, Status screen). Here, not in
# local-panel.yaml: the preview's host build has no Wi-Fi component.
text_sensor:
  - platform: template
    id: panel_wifi_ssid
    internal: true
    update_interval: 10s
    lambda: |-
      if (!wifi::global_wifi_component->is_connected()) return std::string();
      char buf[wifi::SSID_BUFFER_SIZE];
      return std::string(wifi::global_wifi_component->wifi_ssid_to(buf));
  - platform: template
    id: panel_wifi_ip
    internal: true
    update_interval: 10s
    lambda: |-
      if (!wifi::global_wifi_component->is_connected()) return std::string();
      auto ips = wifi::global_wifi_component->wifi_sta_ip_addresses();
      if (!ips[0].is_set()) return std::string();
      char buf[network::IP_ADDRESS_BUFFER_SIZE];
      return std::string(ips[0].str_to(buf));

sensor:
  - id: !extend panel_ignored_touches
    web_server: {sorting_group_id: grp_panel, sorting_weight: 30}
  - platform: template
    id: panel_wifi_rssi
    internal: true
    update_interval: 30s
    lambda: |-
      if (!wifi::global_wifi_component->is_connected()) return NAN;
      return (float) wifi::global_wifi_component->wifi_rssi();
