# Firmware updates from this repository's releases, over HTTPS: found on a
# schedule or on request, installed automatically or on request, from the
# device's page or from Home Assistant's Update entity. Included by
# pool-controller.yaml (packages: updates); its C++ helpers are in updates.h.
# See docs/plans/secret-free-firmware.md (WP6) for the design.
#
# Where updates come from: CI publishes each release's firmware and
# manifest.json on GitHub Pages (.github/workflows/firmware.yml,
# tools/release/manifest.py), served at the project's Pages domain. A fork
# points firmware_site (or firmware_manifest_url) at its own Pages site
# (https://<owner>.github.io/<repo> without a custom domain), in
# pool-controller.yaml's substitutions or with `-s`.
#
# One gate for every install. « Firmware » (Home Assistant's Update entity,
# the page's « Installer ») is a gated_update (components/gated_update/): it
# shows the http_request entity below as it is, but an install only asks
# update_install_request. The http_request entity itself is internal, so
# nothing reaches it but this package. An install then waits while a Manual
# Override or a fill runs (a reboot ends the override, and loses the meter's
# pulses of the fill; « a fill runs » is Fill Running, fill-meter.yaml, so
# never while the meter is off), and starts by itself once both are over,
# unless Cancel Update (the page's « Annuler la demande ») drops it
# meanwhile. Update Status says where it is, as a code: unchecked, checking,
# up_to_date, available, pending:override, pending:fill, installing,
# error:check, error:install (updates.h's status_text). The card and the
# page translate the codes (docs/plans/i18n.md); Home Assistant's device page
# shows them as they are. A published code is never renamed (the card, users'
# automations and the recorder's history read them): add a new one instead.
# Before 1.11.0 these were French words, which the card still reads.
#
# Checks: every Update Check Interval (on_request, 6h, 24h, 7d: codes too,
# translated by the UIs; before 1.11.0, « À la demande », « 6 h », « 24 h »,
# « 7 j »; the choice is kept as hours, update_check_hours, so it survived
# that change), the first one a minute after boot; Check for Update (the
# page's « Vérifier ») any time. Auto Update acts on scheduled checks only:
# an update one of them finds is installed through the gate. One a manual
# check finds (or any, with the interval on on_request) waits for an
# explicit install: the page,
# Home Assistant, the card. An install that fails is tried again at the next
# scheduled check, not in a loop.
#
# Not gated: `make ota` and the ESPHome dashboard's upload (ota: esphome),
# which are a developer's own call.
#
# GLOBAL IDS ARE STABLE FOREVER (NVS key = md5 of the id): auto_update_enabled,
# update_check_hours.

substitutions:
  # The repository's GitHub Pages site, on its custom domain: github.io would
  # answer with a redirect (and without the /<repo> prefix).
  firmware_site: https://pool-controller.kitesize.fr
  firmware_manifest_url: ${firmware_site}/firmware/manifest.json

external_components:
  - source:
      type: local
      path: components
    components: [gated_update]

esphome:
  includes:
    - updates.h
  on_boot:
    # Update Check Interval reads a global and doesn't poll (as
    # device-settings.yaml's settings); Auto Update's lambda runs every loop.
    - priority: -200
      then:
        - lambda: |-
            static_assert(update::UPDATE_STATE_INSTALLING == (int) pool_updates::State::INSTALLING &&
                          update::UPDATE_STATE_AVAILABLE == (int) pool_updates::State::AVAILABLE &&
                          update::UPDATE_STATE_NO_UPDATE == (int) pool_updates::State::NO_UPDATE,
                          "updates.h's State must number states as ESPHome does");
            // Every change of the Firmware entity (a check's result, install
            // progress) refreshes Update Status, and logs a result once.
            id(firmware_update).add_on_state_callback([]() {
              auto *fw = id(firmware_update);
              if (fw->state != id(update_logged_state)) {
                id(update_logged_state) = fw->state;
                if (fw->state == update::UPDATE_STATE_AVAILABLE)
                  ESP_LOGI("updates", "Firmware %s available (installed: %s)",
                           fw->update_info.latest_version.c_str(), fw->update_info.current_version.c_str());
                else if (fw->state == update::UPDATE_STATE_NO_UPDATE)
                  ESP_LOGI("updates", "Firmware up to date (%s)", fw->update_info.current_version.c_str());
              }
              id(update_checking_since_ms) = 0;
              id(update_status_publish).execute();
            });
        - component.update: update_interval_select
        - script.execute: update_status_publish

web_server:
  sorting_groups:
    - id: grp_firmware
      name: "Firmware"
      sorting_weight: 70

http_request:
  # GitHub Pages over HTTPS, checked against ESP-IDF's certificate bundle.
  verify_ssl: true

ota:
  - platform: http_request
    id: ota_http

update:
  # Reads the manifest and installs from it. Internal: Home Assistant and the
  # page see « Firmware » below, so nothing installs around the gate.
  - platform: http_request
    id: firmware_source
    name: "Firmware Source"
    internal: true
    source: ${firmware_manifest_url}
    # Checks are ours (interval: below), at the user's interval.
    update_interval: never
  - platform: gated_update
    id: firmware_update
    name: "Firmware"
    source_id: firmware_source
    web_server: {sorting_group_id: grp_firmware, sorting_weight: 10}
    on_install:
      - script.execute:
          id: update_install_request
          origin: "Home Assistant or the page"

globals:
  # See the header: these ids never change.
  - id: auto_update_enabled
    type: bool
    restore_value: true
    initial_value: 'true'
  - id: update_check_hours
    type: uint32_t
    restore_value: true
    initial_value: '24'
  # Not kept across a reboot: a check a minute after boot, nothing pending.
  - id: update_last_check_ms  # millis() of the last check; 0 = none since boot
    type: uint32_t
    initial_value: '0'
  - id: update_checking_since_ms  # a check on its way; 0 = none
    type: uint32_t
    initial_value: '0'
  - id: update_last_op  # pool_updates::Op: what failed, when the source reports an error
    type: uint8_t
    initial_value: '0'
  - id: update_install_pending
    type: bool
    initial_value: 'false'
  - id: update_install_origin
    type: std::string
    initial_value: '""'
  - id: update_waiting_for  # pool_updates::Blocker last logged, to log a wait once
    type: uint8_t
    initial_value: '0'
  - id: update_auto_armed  # a scheduled check ran and Auto Update hasn't acted on it yet
    type: bool
    initial_value: 'false'
  - id: update_logged_state  # the Firmware state last logged
    type: uint8_t
    initial_value: '0'

script:
  # Update Status, published when it changes.
  - id: update_status_publish
    then:
      - lambda: |-
          auto *src = id(firmware_source);
          pool_updates::StatusInputs in;
          in.state = (pool_updates::State) src->state;
          in.error = src->status_has_error();
          in.last_op = (pool_updates::Op) id(update_last_op);
          in.checking = id(update_checking_since_ms) != 0;
          in.pending = id(update_install_pending);
          in.blocker = pool_updates::gate_blocker(id(manual_override).current_option() != "Auto",
                                                  id(piscine_debit).state);
          std::string text = pool_updates::status_text(in);
          if (!id(update_status).has_state() || id(update_status).state != text)
            id(update_status).publish_state(text);

  # A check, from the schedule or on request. Its result comes back on the
  # Firmware entity (the boot callback above); a failure doesn't, so Update
  # Status settles after the http_request timeout either way.
  - id: update_check
    mode: restart
    parameters:
      origin: string
    then:
      - lambda: |-
          if (!network::is_connected()) {
            ESP_LOGW("updates", "Check for update (%s): no network", origin.c_str());
            return;
          }
          ESP_LOGI("updates", "Checking for update (%s): ${firmware_manifest_url}", origin.c_str());
          id(update_last_check_ms) = millis();
          if (id(update_last_check_ms) == 0) id(update_last_check_ms) = 1;
          id(update_checking_since_ms) = id(update_last_check_ms);
          id(update_last_op) = (uint8_t) pool_updates::Op::CHECK;
          id(firmware_source).check();
      - script.execute: update_status_publish
      - delay: 20s
      - lambda: |-
          if (id(update_checking_since_ms) == 0) return;  // answered
          id(update_checking_since_ms) = 0;
          if (id(firmware_source).status_has_error())
            ESP_LOGW("updates", "Check for update failed (see http_request.update above)");
      - script.execute: update_status_publish

  # An install, from Home Assistant, the page or Auto Update: through the gate.
  - id: update_install_request
    parameters:
      origin: string
    then:
      - lambda: |-
          auto *src = id(firmware_source);
          if (src->state == update::UPDATE_STATE_INSTALLING || id(update_install_pending)) {
            ESP_LOGI("updates", "Install (%s): already under way", origin.c_str());
            return;
          }
          if (src->state != update::UPDATE_STATE_AVAILABLE) {
            ESP_LOGW("updates", "Install (%s): no update available; check first", origin.c_str());
            return;
          }
          ESP_LOGI("updates", "Install of %s requested (%s)", src->update_info.latest_version.c_str(), origin.c_str());
          id(update_install_pending) = true;
          id(update_install_origin) = origin;
          id(update_waiting_for) = (uint8_t) pool_updates::Blocker::NONE;
      - script.execute: update_gate

  # The gate: a pending install starts once no Manual Override and no fill
  # runs. Run on a request and every minute (interval: below).
  - id: update_gate
    then:
      - lambda: |-
          if (!id(update_install_pending)) return;
          auto *src = id(firmware_source);
          if (src->state != update::UPDATE_STATE_AVAILABLE) {
            // A check in the meantime found nothing newer (or an install is on).
            ESP_LOGW("updates", "Install dropped: no update available any more");
            id(update_install_pending) = false;
            return;
          }
          auto blocker = pool_updates::gate_blocker(id(manual_override).current_option() != "Auto",
                                                    pool_fill::state().running);
          if (blocker != pool_updates::Blocker::NONE) {
            if ((uint8_t) blocker != id(update_waiting_for))
              ESP_LOGI("updates", "Install of %s waits: %s in progress",
                       src->update_info.latest_version.c_str(), pool_updates::blocker_label(blocker));
            id(update_waiting_for) = (uint8_t) blocker;
            return;
          }
          ESP_LOGI("updates", "Installing %s (%s), then rebooting: %s",
                   src->update_info.latest_version.c_str(), id(update_install_origin).c_str(),
                   src->update_info.firmware_url.c_str());
          id(update_install_pending) = false;
          id(update_waiting_for) = (uint8_t) pool_updates::Blocker::NONE;
          id(update_last_op) = (uint8_t) pool_updates::Op::INSTALL;
          src->perform(false);
      - script.execute: update_status_publish

  # Cancel Update: drops an install waiting at the gate (the only time one is
  # pending: an open gate installs at once). The update stays available.
  - id: update_install_cancel
    then:
      - lambda: |-
          if (!id(update_install_pending)) {
            ESP_LOGI("updates", "Cancel Update: no install waiting");
            return;
          }
          ESP_LOGI("updates", "Install of %s cancelled (%s; was waiting: %s)",
                   id(firmware_source).update_info.latest_version.c_str(), id(update_install_origin).c_str(),
                   pool_updates::blocker_label((pool_updates::Blocker) id(update_waiting_for)));
          id(update_install_pending) = false;
          id(update_waiting_for) = (uint8_t) pool_updates::Blocker::NONE;
      - script.execute: update_status_publish

text_sensor:
  - platform: template
    name: "Update Status"
    id: update_status
    web_server: {sorting_group_id: grp_firmware, sorting_weight: 20}
    icon: mdi:information-outline
    entity_category: diagnostic

switch:
  # Installs what a scheduled check finds, through the gate. On by default (the owner's
  # decision: automatic, every 24 h); a controller that has saved a choice keeps it.
  - platform: template
    name: "Auto Update"
    id: auto_update_switch
    web_server: {sorting_group_id: grp_firmware, sorting_weight: 30}
    icon: mdi:timer-check
    entity_category: config
    # The global holds the choice; without this, ESPHome's default ALWAYS_OFF
    # runs turn_off_action at every boot and saves « off » over it.
    restore_mode: DISABLED
    lambda: 'return id(auto_update_enabled);'
    turn_on_action:
      - globals.set: {id: auto_update_enabled, value: 'true'}
      - logger.log: {level: INFO, tag: updates, format: "Auto Update on"}
      - script.execute: settings_save
    turn_off_action:
      - globals.set: {id: auto_update_enabled, value: 'false'}
      - logger.log: {level: INFO, tag: updates, format: "Auto Update off"}
      - script.execute: settings_save

select:
  - platform: template
    name: "Update Check Interval"
    id: update_interval_select
    web_server: {sorting_group_id: grp_firmware, sorting_weight: 40}
    icon: mdi:timer-outline
    entity_category: config
    # Codes, as updates.h's INTERVAL_OPTIONS (keep both in step); the UIs translate them.
    options: ["on_request", "6h", "24h", "7d"]
    update_interval: never
    lambda: 'return std::string(pool_updates::interval_label(id(update_check_hours)));'
    set_action:
      - lambda: |-
          id(update_check_hours) = pool_updates::interval_hours(x.str());
          ESP_LOGI("updates", "Update Check Interval: %s", pool_updates::interval_label(id(update_check_hours)));
      - component.update: update_interval_select
      - script.execute: settings_save

button:
  - platform: template
    name: "Check for Update"
    web_server: {sorting_group_id: grp_firmware, sorting_weight: 50}
    icon: mdi:refresh
    entity_category: config
    on_press:
      # A manual check never installs by itself, even with Auto Update on.
      - globals.set: {id: update_auto_armed, value: 'false'}
      - script.execute: {id: update_check, origin: "on request"}
  # Drops an install waiting for a Manual Override or a fill to end; does
  # nothing otherwise. The page shows it only while Update Status is
  # pending:override or pending:fill.
  - platform: template
    name: "Cancel Update"
    id: cancel_update
    web_server: {sorting_group_id: grp_firmware, sorting_weight: 60}
    icon: mdi:close-circle-outline
    entity_category: config
    on_press:
      - script.execute: update_install_cancel

interval:
  # Every minute: a scheduled check when due, Auto Update once that check has
  # answered, and the gate of a pending install.
  - interval: 60s
    then:
      - lambda: |-
          if (network::is_connected() &&
              pool_updates::check_due(millis(), id(update_last_check_ms), id(update_check_hours))) {
            id(update_auto_armed) = true;
            id(update_check).execute("every " + std::string(pool_updates::interval_label(id(update_check_hours))));
          }
          auto step = pool_updates::auto_update_step(
              id(update_auto_armed), id(update_checking_since_ms) != 0, id(auto_update_enabled),
              id(firmware_source).state == update::UPDATE_STATE_AVAILABLE, id(update_install_pending));
          if (step != pool_updates::AutoStep::NONE)
            id(update_auto_armed) = false;
          if (step == pool_updates::AutoStep::INSTALL)
            id(update_install_request).execute("Auto Update");
      - script.execute: update_gate
      - script.execute: update_status_publish
