name: Release

# One version sequence for the card and the firmware: the card's
# `const VERSION = "x.y.z"` in home-assistant/piscine-card.js, one tag per
# release. Every release carries the card; it carries a firmware only when
# something in the firmware changed since the last release that carried one
# (tools/release/firmware_release.py), so a card-only release doesn't make
# every controller download, flash and reboot an identical firmware. The
# controllers then run the last firmware release's version, which may lag
# the card's.
#
# home-assistant/piscine-card.js reaches Home Assistant through HACS, which
# installs this repo's GitHub releases (see hacs.json): each release carries
# the card as its piscine-card.js asset, and its tag is VERSION. That asset is
# the card built with its texts (make card: home-assistant/dist/, minified),
# not the source file, which imports them.
#   - pull request: a change to the card or to the firmware's sources must
#     come with a new VERSION;
#   - push to main: a VERSION with no release yet gets one, which HACS then
#     offers as an update; then HACS's own checks run against it.
# A release with a firmware (firmware.yml) also carries firmware.ota.bin,
# firmware.factory.bin and manifest.json, published on GitHub Pages under
# /firmware/, beside the install page at the site's root, when the
# repository variable PUBLISH_FIRMWARE_PAGES is true. A card-only release
# redeploys the site with the last firmware release's files.
# A firmware can be asked for: a commit with the trailer `Firmware: rebuild`
# (a card change meant for the device's page too), or a manual run with
# `firmware` ticked.

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - home-assistant/piscine-card.js
      - home-assistant/i18n.js
      - home-assistant/i18n/**
      - hacs.json
      - LICENSE
      - "*.yaml"
      - "*.h"
      - components/**
      - webui/**
      - .github/workflows/release.yml
      - .github/workflows/firmware.yml
      - tools/release/**
  workflow_dispatch:
    inputs:
      firmware:
        description: Build the firmware for this release even if nothing in it changed.
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The card as the release ships it: built with its texts, then parsed.
      - name: Card builds and parses
        run: make card && node --check home-assistant/dist/piscine-card.js

      # What ships in a release: the card, and the firmware built from
      # pool-controller.yaml, the packages beside it (any *.yaml at the root),
      # their C++ includes (*.h at the root), the local ESPHome components
      # (components/) and the device's page (webui/, which also bundles the card).
      - name: A changed card or firmware has a new VERSION
        run: |
          # No --depth: on this full clone it would graft the history at the
          # base's tip, and the next step's diff from the last release would
          # find no merge base (always, on a branch other than main).
          git fetch origin "${{ github.base_ref }}"
          changed=$(git diff --name-only FETCH_HEAD -- home-assistant/piscine-card.js home-assistant/i18n.js home-assistant/i18n webui components ':(glob)*.yaml' ':(glob)*.h')
          if [ -z "$changed" ]; then
            echo "Neither the card nor the firmware changed."
            exit 0
          fi
          echo "Changed:"; echo "$changed"
          version=$(sed -nE 's/^const VERSION = "([^"]+)";/\1/p' home-assistant/piscine-card.js)
          test -n "$version" || { echo "::error file=home-assistant/piscine-card.js::No 'const VERSION = \"x.y.z\";' line found."; exit 1; }
          if gh release view "v$version" >/dev/null 2>&1; then
            echo "::error file=home-assistant/piscine-card.js::$(echo "$changed" | paste -sd, -) changed but VERSION is still $version, which is already released. Bump it: HACS and the controllers only see a new release."
            exit 1
          fi
          echo "Will be released as v$version."

      # Says, before the merge, whether the release will carry a firmware.
      - name: Firmware in this release?
        run: |
          since=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '[.[] | select(.draft | not) | select(any(.assets[]; .name == "firmware.ota.bin"))][0].tag_name // ""')
          out=$(python3 tools/release/firmware_release.py --since "$since" --head HEAD)
          echo "$out"
          if [ "$(echo "$out" | tail -n1)" = firmware=true ]; then
            echo "::notice title=With a firmware::The release will carry a new firmware: controllers with Auto Update install it."
          else
            echo "::notice title=Card only::Nothing in the firmware changed since $since: the release will carry the card only, controllers stay on $since. Add a commit trailer 'Firmware: rebuild' to ship one anyway."
          fi

  # On main: is VERSION released yet?
  version:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      new: ${{ steps.version.outputs.new }}
      firmware: ${{ steps.firmware.outputs.firmware }}
      since: ${{ steps.firmware.outputs.since }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: version
        run: |
          card=home-assistant/piscine-card.js
          version=$(sed -nE 's/^const VERSION = "([^"]+)";/\1/p' "$card")
          test -n "$version" || { echo "::error file=$card::No 'const VERSION = \"x.y.z\";' line found."; exit 1; }
          tag="v$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "$tag is already released; nothing to do."
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "$tag isn't released yet."
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

      # Does this release carry a new firmware? Against the last release that
      # carried one (`since`, '' when none does yet).
      - id: firmware
        if: steps.version.outputs.new == 'true'
        env:
          FORCE: ${{ inputs.firmware == true }}
        run: |
          since=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '[.[] | select(.draft | not) | select(any(.assets[]; .name == "firmware.ota.bin"))][0].tag_name // ""')
          echo "since=$since" >> "$GITHUB_OUTPUT"
          args=(--since "$since" --head HEAD)
          if [ "$FORCE" = true ]; then args+=(--force); fi
          python3 tools/release/firmware_release.py "${args[@]}" | tee firmware.out
          tail -n1 firmware.out >> "$GITHUB_OUTPUT"

  # The firmware for that release (firmware.yml), when it carries one. While
  # the firmware still reads secrets.yaml it builds nothing and says why: the
  # release then carries the card only.
  firmware:
    needs: version
    if: needs.version.outputs.new == 'true' && needs.version.outputs.firmware == 'true'
    uses: ./.github/workflows/firmware.yml
    with:
      version: ${{ needs.version.outputs.tag }}

  # Also when the firmware job was skipped (a card-only release), not when it failed.
  release:
    needs: [version, firmware]
    if: ${{ !cancelled() && needs.version.outputs.new == 'true' && needs.firmware.result != 'failure' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.version.outputs.version }}
      TAG: ${{ needs.version.outputs.tag }}
      FIRMWARE: ${{ needs.firmware.outputs.publishable == 'true' && needs.firmware.outputs.artifact || '' }}
      PAGES: ${{ vars.PUBLISH_FIRMWARE_PAGES }}
      WANTED: ${{ needs.version.outputs.firmware }}
      SINCE: ${{ needs.version.outputs.since }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        if: env.FIRMWARE != ''
        with:
          name: ${{ env.FIRMWARE }}
          path: firmware

      # Only a release build of secret-free sources gets this far; check
      # once more that these files are the ones built for this tag.
      - name: Firmware files are this release's
        if: env.FIRMWARE != ''
        run: |
          case "$FIRMWARE" in *placeholder*|*not-a-release*) echo "::error::$FIRMWARE is a test build."; exit 1;; esac
          for f in firmware.ota.bin firmware.factory.bin manifest.json; do test -s "firmware/$f"; done
          test "$(jq -r .version firmware/manifest.json)" = "$TAG"
          test "$(jq -r '.builds[0].ota.md5' firmware/manifest.json)" = "$(md5sum firmware/firmware.ota.bin | cut -d' ' -f1)"

      - name: No firmware in this release
        if: env.FIRMWARE == ''
        run: |
          if [ "$WANTED" = true ]; then
            echo "::notice title=$TAG carries the card only::The firmware still reads secrets.yaml (!secret), so no firmware was built for this release; see the Firmware job's summary."
          else
            echo "::notice title=$TAG carries the card only::Nothing in the firmware changed since $SINCE, so controllers stay on $SINCE."
          fi

      - name: Release VERSION
        run: |
          make card
          card=home-assistant/dist/piscine-card.js
          node --check "$card"
          previous=$(git tag --list 'v*' --sort=-v:refname | head -n1)
          assets=("$card")
          title="piscine-card $VERSION"
          {
            echo "piscine-card $VERSION, for Home Assistant (install or update through HACS)."
            echo
            if [ -n "$FIRMWARE" ]; then
              echo "Pool Controller firmware $TAG: firmware.ota.bin updates an installed controller, firmware.factory.bin is a whole image for a first install, manifest.json describes both."
            elif [ -n "$SINCE" ]; then
              echo "No new firmware: nothing in it changed, controllers stay on $SINCE."
            fi
            if [ -n "$previous" ]; then
              echo
              echo "Changes to the card since $previous:"
              git log --format='- %s' "$previous..HEAD" -- home-assistant/piscine-card.js home-assistant/i18n.js home-assistant/i18n
            fi
            if [ -n "$FIRMWARE" ] && [ -n "$SINCE" ]; then
              echo
              echo "Changes to the firmware since $SINCE:"
              git log --format='- %s' "$SINCE..HEAD" -- webui components ':(glob)*.yaml' ':(glob)*.h'
            fi
          } > notes.md
          if [ -n "$FIRMWARE" ]; then
            assets+=(firmware/firmware.ota.bin firmware/firmware.factory.bin firmware/manifest.json)
            title="pool-controller $VERSION"
          fi
          gh release create "$TAG" "${assets[@]}" --target "$GITHUB_SHA" --title "$title" --notes-file notes.md

      - name: Pages left alone
        if: env.FIRMWARE != '' && env.PAGES != 'true'
        run: echo "::notice title=Firmware not on GitHub Pages::$TAG's firmware is attached to the release only. Publishing it under /firmware/ on GitHub Pages is the owner's call; see README, Releasing."

  # The Pages site: the install page at its root (docs/install/'s contents,
  # so https://pool-controller.kitesize.fr/ is the page), and the release's
  # firmware under /firmware/, the stable URL controllers read for updates
  # (<site>/firmware/manifest.json, beside its two images) and the page
  # installs from (firmware/manifest.json, relative). Each deploy replaces
  # the whole site, so both are put together here, on every release that
  # carries the firmware. The custom domain is a repository setting (Pages
  # deployed by Actions ignore a CNAME file), so the site holds none.
  # A card-only release redeploys it too (the install page may have changed),
  # with the last firmware release's files, so /firmware/ never goes back or
  # goes away.
  # Off until the owner enables Pages (source: GitHub Actions) and sets the
  # repository variable PUBLISH_FIRMWARE_PAGES to true.
  pages:
    needs: [version, firmware, release]
    if: >-
      ${{ !cancelled() && needs.release.result == 'success' && vars.PUBLISH_FIRMWARE_PAGES == 'true'
      && (needs.firmware.outputs.publishable == 'true' || needs.version.outputs.since != '') }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        if: needs.firmware.outputs.publishable == 'true'
        with:
          name: ${{ needs.firmware.outputs.artifact }}
          path: _site/firmware

      - name: The last firmware release's files (a card-only release)
        if: needs.firmware.outputs.publishable != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SINCE: ${{ needs.version.outputs.since }}
        run: |
          gh release download "$SINCE" --dir _site/firmware \
            --pattern firmware.ota.bin --pattern firmware.factory.bin --pattern manifest.json
          test "$(jq -r .version _site/firmware/manifest.json)" = "$SINCE"

      - name: Site
        run: |
          if [ -e docs/install/firmware ]; then
            echo "::error file=docs/install::docs/install/firmware would overwrite the release's /firmware/."
            exit 1
          fi
          test -s docs/install/index.html
          # -L: docs/install/i18n.js is a symlink to home-assistant/i18n.js (the
          # helper the card and the controller's page use too); the site gets the file.
          cp -RL docs/install/. _site/
          if [ -n "$(find _site -type l)" ]; then
            echo "::error file=docs/install::a symlink is left in the site"; exit 1
          fi
          touch _site/.nojekyll
          find _site -type f

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v4

  # HACS's own checks, as HACS will see the repo. After a release, not on
  # pull requests: HACS reads the default branch through GitHub's API, and
  # finds the card in a release's assets, so a PR (or main before the first
  # release) can't pass. Not in HACS's default store, so its store-only
  # checks are skipped: topics, brands (integrations only) and images.
  hacs:
    needs: [version, release]
    if: ${{ !cancelled() && needs.version.result == 'success' && needs.release.result != 'failure' }}
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: plugin
          ignore: brands images topics
