name: Validate

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      # No secrets.yaml: the firmware reads none (device-settings.yaml holds
      # what it used to), and the guard keeps it that way.
      - name: No !secret in the firmware's sources
        run: python3 tools/release/secret_guard.py pool-controller.yaml

      # The ESP32-S3 build (docs/plans/s3-panel.md) includes the WROOM's and
      # adds its own files: the same guard over them.
      - name: No !secret in the S3 build's sources
        run: python3 tools/release/secret_guard.py pool-controller-s3.yaml

      # The firmware's manifest.json (tools/release/manifest.py), on made-up
      # images: what the install page and the update check read.
      - name: Release manifest tests
        run: python3 -I tools/release/test_manifest.py

      # Whether a release carries a new firmware (tools/release/firmware_release.py),
      # on made-up paths and a made-up git repo.
      - name: Firmware-or-not tests
        run: python3 -I tools/release/test_firmware_release.py

      # With the Makefile's pinned ESPHome (ESPHOME_VERSION).
      - name: make validate
        run: make validate

      # The ESP32-S3 build's config (pool-controller-s3.yaml): pool-controller.yaml
      # as a package under the S3's board, pins and panel.
      - name: make validate-s3
        run: make validate-s3

      # Host tests of the firmware's pure C++ helpers (tools/tests/).
      - name: make firmware-test
        run: make firmware-test

      # Prints the web UI layout and fails if pool-controller.yaml gains an
      # entity type the local mock (tools/webui-mock/) can't render, so the
      # mock can't silently fall behind the firmware.
      - name: make mock-ui-check
        run: make mock-ui-check

      # The pages' pure modules: the web UI's (setup wizard logic, time zone
      # table) and the install page's (docs/install/install-model.js).
      - name: make webui-test
        run: make webui-test

      # The interface's texts (docs/plans/i18n.md): every dictionary complete in English, French and
      # Spanish, consistent with the others (placeholders, plurals, markup) and with the code using it,
      # and the Home Assistant files generated from them up to date (make ha-files).
      - name: make i18n-check
        run: make i18n-check

      # The Home Assistant dashboard components (home-assistant/dashboard/, each language's file) name the
      # firmware's entities the way a fresh install does: fail when one no longer exists, or when the pool
      # card there misses an entity the card has gained, so the dashboard can't silently fall behind the
      # firmware. make i18n-check above already failed if a language's file is out of date.
      - name: make ha-dashboard-check
        run: make ha-dashboard-check

      # make migrate's generator and checks (tools/migrate/), on made-up
      # values: never a secrets.yaml or a controller here.
      - name: make migrate-test
        run: make migrate-test

  # The ESP32-S3 build compiled (make build-s3), on pull requests: the S3 has
  # no release yet (S12 of docs/plans/s3-panel.md publishes it), so a broken
  # compile would show nowhere else. Its own job, in parallel with the checks.
  build-s3:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: make build-s3
        run: make build-s3

  # The pool card in every situation of tools/card-preview/ (scenarios.js), on each of its tabs, at a phone's
  # and a screen's width: fails on a page or console error, or on « undefined » / « NaN » in what it shows.
  # Its own job, in parallel: Chromium comes in Playwright's image (make card-preview-check). Against the
  # card as the release ships it (make card: built with its texts, minified); make validate bundles the
  # source into the device's page, so both paths are covered.
  card-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: make card-preview-check
        run: make card-preview-check CARD_BUNDLE=1
