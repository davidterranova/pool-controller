# Generated by make ha-files from pool_fill_too_long.tmpl.yaml (es): edit that template or home-assistant/i18n-yaml/es.json, then make ha-files. Never edit this file.
# Pool Controller — notify while a fill runs too long, until someone acknowledges it.
#
# The alarm and its acknowledgement live on the controller (fill-meter.yaml): Fill Running Too Long turns on
# once a fill has run Fill Alarm After minutes, and Acknowledge Fill Alarm sets Fill Alarm Acknowledged until
# the fill ends. This only turns them into notifications, so the card, the controller's page, HA's device page
# and the phone all agree on whether it was acknowledged. Import it with the link in
# home-assistant/dashboard/README.md (« Fill alarm notifications »); `make ha-dashboard-check` checks it.
#
# One run per alarm, restarted by every trigger (mode: restart):
#   - the alarm turns on (also when the controller reconnects with it on), or HA starts with it on:
#     notify, then again every `repeat` minutes while it is on and not acknowledged;
#   - the acknowledge action on a phone (its title is the ack_title input): press the controller's button; the
#     acknowledgement that follows is the next trigger;
#   - acknowledged, or the alarm ends: clear the notification from the phones; the all-clear actions on the end.
# Every reminder carries the same tag, so a phone shows one notification, replaced each time.
#
# One file per language, from pool_fill_too_long.tmpl.yaml (make ha-files): the French one keeps the path it had
# before, pool_fill_too_long.yaml, since every copy imported until then re-imports from there (its source_url).
blueprint:
  name: "Pool Controller — llenado demasiado largo"
  description: "Avisa mientras el llenado de la piscina dura más que el **Fill Alarm After** del controlador, cada pocos minutos, hasta que alguien confirma la alarma: desde la acción « Confirmar » de la notificación, la tarjeta de la piscina, la página del controlador o su página de dispositivo en Home Assistant. Borra la notificación una vez confirmada la alarma o terminado el llenado, y puede ejecutar acciones propias en cada recordatorio y al final.\n\nLa alarma en sí está en el controlador: activar o desactivar el contador (**Fill Meter**) y ajustar el retardo (**Fill Alarm After**, 0 = nunca) en su página de dispositivo, en Configuración."
  domain: automation
  author: Pool Controller
  source_url: https://github.com/davidterranova/pool-controller/blob/main/home-assistant/blueprints/pool_fill_too_long.es.yaml
  homeassistant:
    min_version: "2024.10.0"
  input:
    controller:
      name: "Controlador"
      icon: mdi:pool
      input:
        alarm:
          name: "Llenado en curso demasiado tiempo (alarma)"
          description: "La alarma del controlador, Fill Running Too Long (un sensor de problema)."
          default: binary_sensor.pool_controller_fill_running_too_long
          selector:
            entity:
              filter:
                - integration: esphome
                  domain: binary_sensor
                  device_class: problem
        acknowledged:
          name: "Alarma confirmada"
          description: "Fill Alarm Acknowledged: encendido en cuanto alguien confirmó la alarma, hasta el final del llenado."
          default: binary_sensor.pool_controller_fill_alarm_acknowledged
          selector:
            entity:
              filter:
                - integration: esphome
                  domain: binary_sensor
        ack_button:
          name: "Botón de confirmación"
          description: "Acknowledge Fill Alarm: el botón del controlador que pulsa la acción de la notificación."
          default: button.pool_controller_acknowledge_fill_alarm
          selector:
            entity:
              filter:
                - integration: esphome
                  domain: button
    notifications:
      name: "Notificaciones"
      icon: mdi:cellphone-message
      input:
        notify_devices:
          name: "Teléfonos"
          description: "Teléfonos con la aplicación Home Assistant que se deben notificar, cada uno con una acción para confirmar la alarma. Ninguno: solo se ejecutan las acciones siguientes."
          default: []
          selector:
            device:
              multiple: true
              filter:
                - integration: mobile_app
        repeat:
          name: "Repetir cada"
          description: "Minutos entre dos recordatorios mientras nadie haya confirmado la alarma."
          default: 15
          selector:
            number:
              min: 5
              max: 240
              step: 5
              unit_of_measurement: min
              mode: box
        title:
          name: "Título"
          description: "El título de la notificación."
          default: "Piscina: el llenado lleva demasiado tiempo"
          selector:
            text:
        message:
          name: "Mensaje"
          description: "Puede usar `{{ since }}`, la hora en que se activó la alarma (HH:MM), y `{{ minutes }}`, los minutos transcurridos desde entonces."
          default: "El llenado está tardando más de lo esperado (alarma a las {{ since }}). Cierre el suministro de agua o «Confirmar» para detener los recordatorios."
          selector:
            text:
              multiline: true
        all_clear_message:
          name: "Mensaje de normalización"
          description: "Se envía a los teléfonos cuando termina la alarma, en lugar del último recordatorio. Déjelo vacío si no hay ninguno."
          default: "Piscina: la alarma de llenado ha terminado."
          selector:
            text:
        ack_title:
          name: "Título de la acción de confirmación"
          description: "El título de la acción de la notificación que confirma la alarma."
          default: "Confirmar"
          selector:
            text:
    more:
      name: "Más acciones"
      icon: mdi:playlist-plus
      collapsed: true
      input:
        extra_actions:
          name: "En cada recordatorio"
          description: "Cualquier otra acción que realizar con cada recordatorio (un altavoz, una luz u otro notificador)."
          default: []
          selector:
            action:
        all_clear_actions:
          name: "Cuando finalice la alarma"
          description: "Se ejecutan una vez terminada la alarma: el llenado terminó, o Fill Alarm After se subió por encima (no al confirmarla)."
          default: []
          selector:
            action:

mode: restart

variables:
  alarm: !input alarm
  acknowledged: !input acknowledged
  ack_button: !input ack_button
  phones: !input notify_devices
  all_clear_message: !input all_clear_message
  # one tag and one action per alarm entity, so two controllers don't clear or acknowledge each other's
  tag: "{{ 'pool_fill_' ~ alarm | replace('.', '_') }}"
  ack_action: "{{ 'POOL_FILL_ACK_' ~ (alarm | replace('.', '_') | upper) }}"
  # mobile_app's notify action is named after the device's own name (not one the user gave it)
  notifiers: "{{ phones | map('device_attr', 'name') | map('slugify') | map('regex_replace', '^', 'notify.mobile_app_') | list }}"

triggers:
  - trigger: state
    entity_id: !input alarm
    to: "on"
    id: alarm
  - trigger: homeassistant
    event: start
    id: alarm
  - trigger: event
    event_type: mobile_app_notification_action
    id: action
  - trigger: state
    entity_id: !input acknowledged
    to: "on"
    id: acknowledged
  - trigger: state
    entity_id: !input alarm
    from: "on"
    to: "off"
    id: ended

# Checked before the run restarts: another notification's action must not stop the reminders.
conditions:
  - condition: template
    value_template: "{{ trigger.id != 'action' or trigger.event.data.action == ack_action }}"

actions:
  - choose:
      - alias: "Confirmada desde un teléfono"
        conditions:
          - condition: trigger
            id: action
        sequence:
          - action: button.press
            target:
              entity_id: "{{ ack_button }}"

      - alias: "Confirmada o finalizó el llenado"
        conditions:
          - condition: trigger
            id: [acknowledged, ended]
        sequence:
          - repeat:
              for_each: "{{ notifiers }}"
              sequence:
                - action: "{{ repeat.item }}"
                  continue_on_error: true
                  data:
                    message: clear_notification
                    data:
                      tag: "{{ tag }}"
          - if:
              - condition: trigger
                id: ended
            then:
              - if:
                  - condition: template
                    value_template: "{{ all_clear_message | length > 0 }}"
                then:
                  - repeat:
                      for_each: "{{ notifiers }}"
                      sequence:
                        - action: "{{ repeat.item }}"
                          continue_on_error: true
                          data:
                            message: "{{ all_clear_message }}"
                            data:
                              tag: "{{ tag }}"
              - choose: []
                default: !input all_clear_actions

    default:
      - alias: "Recordar mientras la alarma esté activa y no se haya confirmado"
        repeat:
          while:
            - condition: state
              entity_id: !input alarm
              state: "on"
            - condition: not
              conditions:
                - condition: state
                  entity_id: !input acknowledged
                  state: "on"
          sequence:
            - variables:
                since: "{{ as_timestamp(states[alarm].last_changed) | timestamp_custom('%H:%M') }}"
                minutes: "{{ ((now() - states[alarm].last_changed).total_seconds() / 60) | round(0) | int }}"
            - repeat:
                for_each: "{{ notifiers }}"
                sequence:
                  - action: "{{ repeat.item }}"
                    continue_on_error: true
                    data:
                      title: !input title
                      message: !input message
                      data:
                        tag: "{{ tag }}"
                        actions:
                          - action: "{{ ack_action }}"
                            title: !input ack_title
                        push:
                          interruption-level: time-sensitive
            - choose: []
              default: !input extra_actions
            - delay:
                minutes: !input repeat
