# Generated by make ha-files from pool_fill_too_long.tmpl.yaml (fr): edit that template or home-assistant/i18n-yaml/fr.json, then make ha-files. Never edit this file.
# Pool Controller — notify while a fill runs too long, until someone acknowledges it.
#
# The alarm and its acknowledgement live on the controller (fill-meter.yaml): Fill Running Too Long turns on
# once a fill has run Fill Alarm After minutes, and Acknowledge Fill Alarm sets Fill Alarm Acknowledged until
# the fill ends. This only turns them into notifications, so the card, the controller's page, HA's device page
# and the phone all agree on whether it was acknowledged. Import it with the link in
# home-assistant/dashboard/README.md (« Fill alarm notifications »); `make ha-dashboard-check` checks it.
#
# One run per alarm, restarted by every trigger (mode: restart):
#   - the alarm turns on (also when the controller reconnects with it on), or HA starts with it on:
#     notify, then again every `repeat` minutes while it is on and not acknowledged;
#   - the acknowledge action on a phone (its title is the ack_title input): press the controller's button; the
#     acknowledgement that follows is the next trigger;
#   - acknowledged, or the alarm ends: clear the notification from the phones; the all-clear actions on the end.
# Every reminder carries the same tag, so a phone shows one notification, replaced each time.
#
# One file per language, from pool_fill_too_long.tmpl.yaml (make ha-files): the French one keeps the path it had
# before, pool_fill_too_long.yaml, since every copy imported until then re-imports from there (its source_url).
blueprint:
  name: "Pool Controller — remplissage trop long"
  description: "Prévient tant que le remplissage de la piscine dure plus que le **Fill Alarm After** du contrôleur, toutes les quelques minutes, jusqu'à ce que quelqu'un acquitte l'alerte : depuis l'action « Acquitter » de la notification, la carte de la piscine, la page du contrôleur ou sa page d'appareil dans Home Assistant. Efface la notification une fois l'alerte acquittée ou le remplissage terminé, et peut lancer vos propres actions à chaque rappel et à la fin.\n\nL'alerte elle-même est sur le contrôleur : activer ou couper le compteur (**Fill Meter**) et régler le délai (**Fill Alarm After**, 0 = jamais) sur sa page d'appareil, sous Configuration."
  domain: automation
  author: Pool Controller
  source_url: https://github.com/davidterranova/pool-controller/blob/main/home-assistant/blueprints/pool_fill_too_long.yaml
  homeassistant:
    min_version: "2024.10.0"
  input:
    controller:
      name: "Contrôleur"
      icon: mdi:pool
      input:
        alarm:
          name: "Remplissage trop long (alerte)"
          description: "L'alerte du contrôleur, Fill Running Too Long (un capteur de problème)."
          default: binary_sensor.pool_controller_fill_running_too_long
          selector:
            entity:
              filter:
                - integration: esphome
                  domain: binary_sensor
                  device_class: problem
        acknowledged:
          name: "Alerte acquittée"
          description: "Fill Alarm Acknowledged : allumé dès que quelqu'un a acquitté l'alerte, jusqu'à la fin du remplissage."
          default: binary_sensor.pool_controller_fill_alarm_acknowledged
          selector:
            entity:
              filter:
                - integration: esphome
                  domain: binary_sensor
        ack_button:
          name: "Bouton d'acquittement"
          description: "Acknowledge Fill Alarm : le bouton du contrôleur que presse l'action de la notification."
          default: button.pool_controller_acknowledge_fill_alarm
          selector:
            entity:
              filter:
                - integration: esphome
                  domain: button
    notifications:
      name: "Notifications"
      icon: mdi:cellphone-message
      input:
        notify_devices:
          name: "Téléphones"
          description: "Téléphones avec l'application Home Assistant à prévenir, chacun avec une action pour acquitter l'alerte. Aucun : seules les actions ci-dessous s'exécutent."
          default: []
          selector:
            device:
              multiple: true
              filter:
                - integration: mobile_app
        repeat:
          name: "Répéter toutes les"
          description: "Minutes entre deux rappels tant que personne n'a acquitté l'alerte."
          default: 15
          selector:
            number:
              min: 5
              max: 240
              step: 5
              unit_of_measurement: min
              mode: box
        title:
          name: "Titre"
          description: "Le titre de la notification."
          default: "Piscine : remplissage trop long"
          selector:
            text:
        message:
          name: "Message"
          description: "Peut utiliser `{{ since }}`, l'heure du début de l'alerte (HH:MM), et `{{ minutes }}`, les minutes écoulées depuis."
          default: "Le remplissage dure plus que prévu (alerte à {{ since }}). Fermer l'arrivée d'eau, ou « Acquitter » pour arrêter les rappels."
          selector:
            text:
              multiline: true
        all_clear_message:
          name: "Message de fin d'alerte"
          description: "Envoyé aux téléphones à la fin de l'alerte, à la place du dernier rappel. Vide : aucun."
          default: "Piscine : fin de l'alerte de remplissage."
          selector:
            text:
        ack_title:
          name: "Titre de l'action d'acquittement"
          description: "Le titre de l'action de la notification qui acquitte l'alerte."
          default: "Acquitter"
          selector:
            text:
    more:
      name: "Autres actions"
      icon: mdi:playlist-plus
      collapsed: true
      input:
        extra_actions:
          name: "À chaque rappel"
          description: "Tout ce qu'il faut faire d'autre à chaque rappel (une enceinte, une lampe, un autre notificateur)."
          default: []
          selector:
            action:
        all_clear_actions:
          name: "À la fin de l'alerte"
          description: "Exécutées une fois l'alerte terminée : le remplissage s'est arrêté, ou Fill Alarm After a été relevé au-delà (pas sur un acquittement)."
          default: []
          selector:
            action:

mode: restart

variables:
  alarm: !input alarm
  acknowledged: !input acknowledged
  ack_button: !input ack_button
  phones: !input notify_devices
  all_clear_message: !input all_clear_message
  # one tag and one action per alarm entity, so two controllers don't clear or acknowledge each other's
  tag: "{{ 'pool_fill_' ~ alarm | replace('.', '_') }}"
  ack_action: "{{ 'POOL_FILL_ACK_' ~ (alarm | replace('.', '_') | upper) }}"
  # mobile_app's notify action is named after the device's own name (not one the user gave it)
  notifiers: "{{ phones | map('device_attr', 'name') | map('slugify') | map('regex_replace', '^', 'notify.mobile_app_') | list }}"

triggers:
  - trigger: state
    entity_id: !input alarm
    to: "on"
    id: alarm
  - trigger: homeassistant
    event: start
    id: alarm
  - trigger: event
    event_type: mobile_app_notification_action
    id: action
  - trigger: state
    entity_id: !input acknowledged
    to: "on"
    id: acknowledged
  - trigger: state
    entity_id: !input alarm
    from: "on"
    to: "off"
    id: ended

# Checked before the run restarts: another notification's action must not stop the reminders.
conditions:
  - condition: template
    value_template: "{{ trigger.id != 'action' or trigger.event.data.action == ack_action }}"

actions:
  - choose:
      - alias: "Acquittée depuis un téléphone"
        conditions:
          - condition: trigger
            id: action
        sequence:
          - action: button.press
            target:
              entity_id: "{{ ack_button }}"

      - alias: "Acquittée, ou remplissage terminé"
        conditions:
          - condition: trigger
            id: [acknowledged, ended]
        sequence:
          - repeat:
              for_each: "{{ notifiers }}"
              sequence:
                - action: "{{ repeat.item }}"
                  continue_on_error: true
                  data:
                    message: clear_notification
                    data:
                      tag: "{{ tag }}"
          - if:
              - condition: trigger
                id: ended
            then:
              - if:
                  - condition: template
                    value_template: "{{ all_clear_message | length > 0 }}"
                then:
                  - repeat:
                      for_each: "{{ notifiers }}"
                      sequence:
                        - action: "{{ repeat.item }}"
                          continue_on_error: true
                          data:
                            message: "{{ all_clear_message }}"
                            data:
                              tag: "{{ tag }}"
              - choose: []
                default: !input all_clear_actions

    default:
      - alias: "Rappels tant que l'alerte est active et non acquittée"
        repeat:
          while:
            - condition: state
              entity_id: !input alarm
              state: "on"
            - condition: not
              conditions:
                - condition: state
                  entity_id: !input acknowledged
                  state: "on"
          sequence:
            - variables:
                since: "{{ as_timestamp(states[alarm].last_changed) | timestamp_custom('%H:%M') }}"
                minutes: "{{ ((now() - states[alarm].last_changed).total_seconds() / 60) | round(0) | int }}"
            - repeat:
                for_each: "{{ notifiers }}"
                sequence:
                  - action: "{{ repeat.item }}"
                    continue_on_error: true
                    data:
                      title: !input title
                      message: !input message
                      data:
                        tag: "{{ tag }}"
                        actions:
                          - action: "{{ ack_action }}"
                            title: !input ack_title
                        push:
                          interruption-level: time-sensitive
            - choose: []
              default: !input extra_actions
            - delay:
                minutes: !input repeat
