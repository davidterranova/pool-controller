# Pool Controller — notify while a fill runs too long, until someone acknowledges it.
#
# The alarm and its acknowledgement live on the controller (fill-meter.yaml): Fill Running Too Long turns on
# once a fill has run Fill Alarm After minutes, and Acknowledge Fill Alarm sets Fill Alarm Acknowledged until
# the fill ends. This only turns them into notifications, so the card, the controller's page, HA's device page
# and the phone all agree on whether it was acknowledged. Import it with the link in
# home-assistant/dashboard/README.md (« Fill alarm notifications »); `make ha-dashboard-check` checks it.
#
# One run per alarm, restarted by every trigger (mode: restart):
#   - the alarm turns on (also when the controller reconnects with it on), or HA starts with it on:
#     notify, then again every `repeat` minutes while it is on and not acknowledged;
#   - « Acquitter » on a phone: press the controller's button; the acknowledgement that follows is the next trigger;
#   - acknowledged, or the alarm ends: clear the notification from the phones; the all-clear actions on the end.
# Every reminder carries the same tag, so a phone shows one notification, replaced each time.
blueprint:
  name: Pool Controller — fill running too long
  description: >-
    Notifies while the pool's fill runs longer than the controller's **Fill Alarm After**, every few minutes
    until someone acknowledges it: from the phone notification's « Acquitter », the pool card, the controller's
    own page or its device page in Home Assistant. Clears the notification once acknowledged or once the fill
    ends, and can run actions of your own on each reminder and when it is over.


    The alarm itself is on the controller: turn the meter on or off (**Fill Meter**) and set the delay
    (**Fill Alarm After**, 0 = never) on its device page, under Configuration.
  domain: automation
  author: Pool Controller
  source_url: https://github.com/davidterranova/pool-controller/blob/main/home-assistant/blueprints/pool_fill_too_long.yaml
  homeassistant:
    min_version: "2024.10.0"
  input:
    controller:
      name: Controller
      icon: mdi:pool
      input:
        alarm:
          name: Fill Running Too Long
          description: The controller's alarm (a problem sensor).
          default: binary_sensor.pool_controller_fill_running_too_long
          selector:
            entity:
              filter:
                - integration: esphome
                  domain: binary_sensor
                  device_class: problem
        acknowledged:
          name: Fill Alarm Acknowledged
          description: On once someone acknowledged the alarm, until the fill ends.
          default: binary_sensor.pool_controller_fill_alarm_acknowledged
          selector:
            entity:
              filter:
                - integration: esphome
                  domain: binary_sensor
        ack_button:
          name: Acknowledge Fill Alarm
          description: The button « Acquitter » on a phone presses.
          default: button.pool_controller_acknowledge_fill_alarm
          selector:
            entity:
              filter:
                - integration: esphome
                  domain: button
    notifications:
      name: Notifications
      icon: mdi:cellphone-message
      input:
        notify_devices:
          name: Phones
          description: >-
            Phones with the Home Assistant app to notify, each with an « Acquitter » action. None: only the
            actions below run.
          default: []
          selector:
            device:
              multiple: true
              filter:
                - integration: mobile_app
        repeat:
          name: Repeat every
          description: Minutes between two reminders while nobody has acknowledged the alarm.
          default: 15
          selector:
            number:
              min: 5
              max: 240
              step: 5
              unit_of_measurement: min
              mode: box
        title:
          name: Title
          default: "Piscine : remplissage trop long"
          selector:
            text:
        message:
          name: Message
          description: >-
            May use `{{ since }}`, the time the alarm went on (HH:MM), and `{{ minutes }}`, the minutes since.
          default: >-
            Le remplissage dure plus que prévu (alerte à {{ since }}). Fermer l'arrivée d'eau, ou
            « Acquitter » pour arrêter les rappels.
          selector:
            text:
              multiline: true
        all_clear_message:
          name: All-clear message
          description: Sent to the phones when the alarm ends, in place of the last reminder. Empty for none.
          default: "Piscine : remplissage terminé."
          selector:
            text:
    more:
      name: More actions
      icon: mdi:playlist-plus
      collapsed: true
      input:
        extra_actions:
          name: On each reminder
          description: Anything else to do with each reminder (a speaker, a light, another notifier).
          default: []
          selector:
            action:
        all_clear_actions:
          name: When the alarm ends
          description: Run once the fill has ended (not on an acknowledgement).
          default: []
          selector:
            action:

mode: restart

variables:
  alarm: !input alarm
  acknowledged: !input acknowledged
  ack_button: !input ack_button
  phones: !input notify_devices
  all_clear_message: !input all_clear_message
  # one tag and one action per alarm entity, so two controllers don't clear or acknowledge each other's
  tag: "{{ 'pool_fill_' ~ alarm | replace('.', '_') }}"
  ack_action: "{{ 'POOL_FILL_ACK_' ~ (alarm | replace('.', '_') | upper) }}"
  # mobile_app's notify action is named after the device's own name (not one the user gave it)
  notifiers: "{{ phones | map('device_attr', 'name') | map('slugify') | map('regex_replace', '^', 'notify.mobile_app_') | list }}"

triggers:
  - trigger: state
    entity_id: !input alarm
    to: "on"
    id: alarm
  - trigger: homeassistant
    event: start
    id: alarm
  - trigger: event
    event_type: mobile_app_notification_action
    id: action
  - trigger: state
    entity_id: !input acknowledged
    to: "on"
    id: acknowledged
  - trigger: state
    entity_id: !input alarm
    from: "on"
    to: "off"
    id: ended

# Checked before the run restarts: another notification's action must not stop the reminders.
conditions:
  - condition: template
    value_template: "{{ trigger.id != 'action' or trigger.event.data.action == ack_action }}"

actions:
  - choose:
      - alias: « Acquitter » on a phone
        conditions:
          - condition: trigger
            id: action
        sequence:
          - action: button.press
            target:
              entity_id: "{{ ack_button }}"

      - alias: Acknowledged, or the fill ended
        conditions:
          - condition: trigger
            id: [acknowledged, ended]
        sequence:
          - repeat:
              for_each: "{{ notifiers }}"
              sequence:
                - action: "{{ repeat.item }}"
                  continue_on_error: true
                  data:
                    message: clear_notification
                    data:
                      tag: "{{ tag }}"
          - if:
              - condition: trigger
                id: ended
            then:
              - if:
                  - condition: template
                    value_template: "{{ all_clear_message | length > 0 }}"
                then:
                  - repeat:
                      for_each: "{{ notifiers }}"
                      sequence:
                        - action: "{{ repeat.item }}"
                          continue_on_error: true
                          data:
                            message: "{{ all_clear_message }}"
                            data:
                              tag: "{{ tag }}"
              - choose: []
                default: !input all_clear_actions

    default:
      - alias: Remind while on and not acknowledged
        repeat:
          while:
            - condition: state
              entity_id: !input alarm
              state: "on"
            - condition: not
              conditions:
                - condition: state
                  entity_id: !input acknowledged
                  state: "on"
          sequence:
            - variables:
                since: "{{ as_timestamp(states[alarm].last_changed) | timestamp_custom('%H:%M') }}"
                minutes: "{{ ((now() - states[alarm].last_changed).total_seconds() / 60) | round(0) | int }}"
            - repeat:
                for_each: "{{ notifiers }}"
                sequence:
                  - action: "{{ repeat.item }}"
                    continue_on_error: true
                    data:
                      title: !input title
                      message: !input message
                      data:
                        tag: "{{ tag }}"
                        actions:
                          - action: "{{ ack_action }}"
                            title: Acquitter
                        push:
                          interruption-level: time-sensitive
            - choose: []
              default: !input extra_actions
            - delay:
                minutes: !input repeat
