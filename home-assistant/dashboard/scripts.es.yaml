# Generated by make ha-files from scripts.tmpl.yaml (es): edit that template or home-assistant/i18n-yaml/es.json, then make ha-files. Never edit this file.
# The two Home Assistant scripts piscine-card calls (see README.md here). They only set the controller's
# Manual Override select and its timeout; the controller does the rest (freeze protection first, the
# override's own expiry, back to Auto). Entity ids are a fresh install's: see README.md, « Entity ids ».
#
# Paste into Home Assistant's scripts.yaml, or create each one in Settings → Automations & scenes →
# Scripts → ⋮ → Edit in YAML (the key below is the script's id).
#
# The ids, the fields and the speeds' values are the card's API: the same in every language, never translated.
# Only the texts a person reads are.

piscine_forcer_vitesse:
  alias: "Piscina — forzar una velocidad"
  description: "Fuerza la bomba de la piscina a una velocidad mediante el select Manual Override del controlador. El controlador termina el forzado por sí solo tras Manual Override Timeout minutos (0 = nunca); pasar `duree` para ajustar antes ese tiempo."
  icon: mdi:pump
  mode: queued
  max: 3
  fields:
    vitesse:
      name: "Velocidad"
      description: "La velocidad que se debe forzar. En YAML, su valor es Off, Low, Medium o High, independientemente del idioma."
      required: true
      selector:
        select:
          options:
            - {value: "Off", label: "Apagada"}
            - {value: "Low", label: "Baja"}
            - {value: "Medium", label: "Media"}
            - {value: "High", label: "Alta"}
    duree:
      name: "Duración (min)"
      description: "Minutos antes de volver a Auto; 0 = nunca. Vacío: la duración ya configurada en el controlador."
      required: false
      selector:
        number: {min: 0, max: 480, step: 5, unit_of_measurement: min, mode: box}
  sequence:
    - if:
        # optional field: no native condition can test whether a script variable was passed
        - condition: template
          value_template: "{{ duree is defined }}"
      then:
        - action: number.set_value
          target: {entity_id: number.pool_controller_manual_override_timeout}
          data: {value: "{{ duree }}"}
    - action: select.select_option
      target: {entity_id: select.pool_controller_manual_override}
      data: {option: "{{ vitesse }}"}

piscine_retour_auto:
  alias: "Piscina — volver a Auto"
  description: "Devuelve la bomba al plan autónomo del controlador (Manual Override → Auto)."
  icon: mdi:autorenew
  mode: single
  max_exceeded: silent
  sequence:
    - action: select.select_option
      target: {entity_id: select.pool_controller_manual_override}
      data: {option: "Auto"}
