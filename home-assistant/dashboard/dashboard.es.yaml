# Generated by make ha-files from dashboard.tmpl.yaml (es): edit that template or home-assistant/i18n-yaml/es.json, then make ha-files. Never edit this file.
# Pool Controller — a Home Assistant dashboard built from this firmware's entities (see README.md here).
#
# Each section is one component; take the whole file (dashboard ⋮ → Edit dashboard → ⋮ → Raw configuration
# editor) or copy the sections you want into a dashboard of your own. Entity ids are a fresh install's
# (`make ha-dashboard-check` checks them against pool-controller.yaml); on an install whose device was
# renamed, replace the `pool_controller_` prefix (README.md, « Entity ids »).
#
# Only Home Assistant's own cards, plus piscine-card from this repo (Marketplace, « Piscine Card »).
title: "Piscina"
views:
  - title: "Piscina"
    path: piscine
    icon: mdi:pool
    type: sections
    max_columns: 3
    sections:
      # ── Component: the pump ────────────────────────────────────────────────────────────────────────
      # piscine-card's panel, three tabs, and a light in its header that opens the controller's device page.
      # « Contrôle »: state, today's plan, the pool's temperature (24 h to 1 an), Auto/Manuel, then fill
      # water today, this month, per day, week or month. « Réglages »: today's plan in detail with
      # « Recalculer », the probes, every setting, the last 7 days. « Réglages contrôleur »: the controller's
      # position and time zone, with « Utiliser la position et le fuseau de Home Assistant », and its
      # firmware (its updates). Most of its
      # defaults are one particular install's entity ids, so every entity is given here, once (&pool,
      # reused by the settings below); the firmware-update ones (firmware, checkUpdate, cancelUpdate,
      # autoUpdate, updateInterval, updateStatus) already default to a fresh install's. It calls the two
      # scripts of scripts.<language>.yaml.
      - type: grid
        cards:
          - type: heading
            heading: "Bomba"
            icon: mdi:pump
          - type: custom:piscine-card
            variant: panel
            grid_options: {columns: full}
            entities: &pool
              override: select.pool_controller_manual_override
              commanded: sensor.pool_controller_pump_commanded_speed
              planned: sensor.pool_controller_pump_planned_speed
              nextAt: sensor.pool_controller_next_speed_change
              nextTo: sensor.pool_controller_next_planned_speed
              b1s: sensor.pool_controller_schedule_block_1_start
              b1e: sensor.pool_controller_schedule_block_1_end
              b2s: sensor.pool_controller_schedule_block_2_start
              b2e: sensor.pool_controller_schedule_block_2_end
              hoursToday: sensor.pool_controller_filtration_hours_today
              hoursPlanned: sensor.pool_controller_planned_filtration_hours
              water: sensor.pool_controller_pool_return_temperature
              waterMin: sensor.pool_controller_pool_water_min_today
              waterMax: sensor.pool_controller_pool_water_max_today
              history: sensor.pool_controller_daily_history
              planHistory: sensor.pool_controller_daily_plan_history
              outdoor: sensor.pool_controller_outdoor_temperature
              online: binary_sensor.pool_controller_status
              stuck: binary_sensor.pool_controller_manual_override_active
              notComputed: binary_sensor.pool_controller_schedule_not_computed
              recomputed: sensor.pool_controller_last_recomputed_at
              boostInterval: number.pool_controller_boost_pulse_interval
              boostDuration: number.pool_controller_boost_pulse_duration
              highEvery: number.pool_controller_high_boost_frequency
              sun: sun.sun
              timeout: number.pool_controller_manual_override_timeout
              freezeAt: number.pool_controller_freeze_protection_temperature
              endsAt: sensor.pool_controller_manual_override_ends_at
              flow: sensor.pool_controller_piscine_debit_remplissage
              volume: sensor.pool_controller_piscine_volume_total_remplissage
              fillEnabled: switch.pool_controller_fill_meter    # fill-meter.yaml: off hides the fill water
              fillAlarmAfter: number.pool_controller_fill_alarm_after
              fillRunning: binary_sensor.pool_controller_fill_running
              fillTooLong: binary_sensor.pool_controller_fill_running_too_long   # the banner, the pulsing light
              fillAck: button.pool_controller_acknowledge_fill_alarm
              fillAcked: binary_sensor.pool_controller_fill_alarm_acknowledged
              min: number.pool_controller_min_filtration_hours
              max: number.pool_controller_max_filtration_hours
              offset: number.pool_controller_filtration_hour_offset
              warm: number.pool_controller_warmest_part_of_day_offset
              pending: binary_sensor.pool_controller_filtration_config_pending
              apply: button.pool_controller_apply_filtration_config
              pad: sensor.pool_controller_equipment_pad_temperature
              nextBoostStart: sensor.pool_controller_next_boost_start
              nextBoostEnd: sensor.pool_controller_next_boost_end
              recompute: button.pool_controller_recompute_schedule_now
              updateTemps: button.pool_controller_update_temperature_sensors_now
              clock: datetime.pool_controller_device_clock    # wifi-setup.yaml: the light's heartbeat, every minute
              fwVersion: sensor.pool_controller_firmware_version
              esphomeVersion: sensor.pool_controller_esphome_version
              latitude: number.pool_controller_latitude      # these four: « Réglages contrôleur » › Position
              longitude: number.pool_controller_longitude
              timezone: text.pool_controller_timezone
              timezoneName: text.pool_controller_timezone_name
              sForce: script.piscine_forcer_vitesse
              sAuto: script.piscine_retour_auto

      # ── Component: temperatures ────────────────────────────────────────────────────────────────────
      # The three probes as measured. The pool probe sits on the return pipe: pump stopped, it reads the
      # pipe drifting toward the equipment pad, so its curve and its daily mean include the pipe. The
      # pool's own range (pumping readings only) is the card's temperature graph.
      - type: grid
        cards:
          - type: heading
            heading: "Temperaturas"
            icon: mdi:thermometer-water
          - type: history-graph
            title: "Sondas, 24 h"
            hours_to_show: 24
            grid_options: {columns: full}
            entities:
              - entity: sensor.pool_controller_pool_return_temperature
                name: "Retorno del filtro (a la piscina mientras funciona la bomba)"
              - entity: sensor.pool_controller_equipment_pad_temperature
                name: "Cuarto de equipos"
              - entity: sensor.pool_controller_outdoor_temperature
                name: "Exterior"
          - type: statistics-graph
            title: "Sondas, media diaria (90 días)"
            period: day
            days_to_show: 90
            chart_type: line
            stat_types: [mean]
            grid_options: {columns: full}
            entities:
              - entity: sensor.pool_controller_pool_return_temperature
                name: "Retorno del filtro"
              - entity: sensor.pool_controller_equipment_pad_temperature
                name: "Cuarto de equipos"
              - entity: sensor.pool_controller_outdoor_temperature
                name: "Exterior"

      # ── Component: pump, plan against reality ──────────────────────────────────────────────────────
      # What the plan alone would do, what the pump was told, and the override that made the difference.
      # Raw history (a timeline per entity), so exact; the recorder keeps about 10 days of it.
      - type: grid
        cards:
          - type: heading
            heading: "Plan frente a realidad"
            icon: mdi:chart-timeline-variant
          - type: history-graph
            title: "Velocidad de la bomba, 24 h"
            hours_to_show: 24
            grid_options: {columns: full}
            entities:
              - entity: sensor.pool_controller_pump_planned_speed
                name: "Planificado"
              - entity: sensor.pool_controller_pump_commanded_speed
                name: "Bomba"
              - entity: select.pool_controller_manual_override
                name: "Forzado"
          # Each day climbs to its total and falls back at midnight, against the day's planned hours.
          # Raw history rather than daily statistics: Filtration Hours Today resets at midnight, and a
          # statistics day also counts the value it starts with, so a short day would show the day before.
          - type: history-graph
            title: "Filtración, 7 días"
            hours_to_show: 168
            grid_options: {columns: full}
            entities:
              - entity: sensor.pool_controller_filtration_hours_today
                name: "Real"
              - entity: sensor.pool_controller_planned_filtration_hours
                name: "Planificado"

      # ── Component: fill water ──────────────────────────────────────────────────────────────────────
      # The water meter on the fill line. Its total only grows, so its daily statistics (change) are exact.
      # piscine-card's « Contrôle » draws the same, by day, week or month with the period's total;
      # this is the same meter with Home Assistant's own cards, for a dashboard without the card.
      # The meter is optional: the section hides itself while Fill Meter is off (« not off », so a
      # firmware from before the switch, which has no such entity, still shows it).
      - type: grid
        visibility:
          - condition: state
            entity: switch.pool_controller_fill_meter
            state_not: "off"
        cards:
          - type: heading
            heading: "Agua de llenado"
            icon: mdi:water
          - type: tile
            entity: sensor.pool_controller_piscine_debit_remplissage
            name: "Caudal"
            grid_options: {columns: 6}
          - type: statistic
            entity: sensor.pool_controller_piscine_volume_total_remplissage
            name: "Hoy"
            stat_type: change
            period: {calendar: {period: day}}
            grid_options: {columns: 6}
          - type: statistics-graph
            title: "Agua de llenado por día (30 días)"
            period: day
            days_to_show: 30
            chart_type: bar
            stat_types: [change]
            grid_options: {columns: full}
            entities:
              - entity: sensor.pool_controller_piscine_volume_total_remplissage
                name: "Volumen"

  - title: "Ajustes"
    path: reglages
    icon: mdi:cog
    type: sections
    max_columns: 3
    sections:
      # ── Component: alerts ──────────────────────────────────────────────────────────────────────────
      # Each shows only while its problem is on. The fill alarm is the controller's (Fill Running Too Long,
      # after Fill Alarm After minutes); « Acquitter » stops the blueprint's reminders, and stays away once
      # someone acknowledged it, from here, the pool card, the controller's page or a phone.
      - type: grid
        cards:
          - type: markdown
            visibility:
              - condition: state
                entity: binary_sensor.pool_controller_fill_running_too_long
                state: "on"
            grid_options: {columns: full}
            content: "## ⚠️ Llenado con una duración inusualmente larga\n{% set on = states.binary_sensor.pool_controller_fill_running_too_long.last_changed %} El llenado lleva más de **{{ states('number.pool_controller_fill_alarm_after') | int(0) }} min** en curso (alarma a las {{ as_local(on).strftime('%H:%M') }}). Revise el suministro de agua, la válvula de flotador o posibles fugas. {% if is_state('binary_sensor.pool_controller_fill_alarm_acknowledged', 'on') %} Alarma **confirmada**: no habrá más recordatorios hasta que termine este llenado. {% else %} Los recordatorios continúan hasta que alguien la confirme. {% endif %}"
          - type: button
            visibility:
              - condition: state
                entity: binary_sensor.pool_controller_fill_running_too_long
                state: "on"
              - condition: state
                entity: binary_sensor.pool_controller_fill_alarm_acknowledged
                state_not: "on"
            entity: button.pool_controller_acknowledge_fill_alarm
            name: "Confirmar"
            icon: mdi:bell-check
            show_state: false
            grid_options: {columns: 6, rows: 1}
            tap_action:
              action: perform-action
              perform_action: button.press
              target:
                entity_id: button.pool_controller_acknowledge_fill_alarm
          - type: markdown
            visibility:
              - condition: state
                entity: binary_sensor.pool_controller_manual_override_active
                state: "on"
            grid_options: {columns: full}
            content: "## ⚠️ Filtración en pausa\n**Manual Override** está en **{{ states('select.pool_controller_manual_override') }}** desde hace más de 30 min, sin límite de tiempo: la bomba ya no sigue su plan. Volver a **Auto**, o dar una duración al forzado (el controlador volverá entonces a Auto por sí solo)."
          - type: markdown
            visibility:
              - condition: state
                entity: binary_sensor.pool_controller_schedule_not_computed
                state: "on"
            grid_options: {columns: full}
            content: "## ⚠️ El plan de hoy no se ha calculado\nEl controlador no pudo leer la temperatura ni la hora de salida del sol: la bomba puede permanecer parada. Comprueba las sondas y, a continuación, **vuelve a calcular el plan**."

      # ── Component: settings ────────────────────────────────────────────────────────────────────────
      # Everything the controller lets you tune: piscine-card's settings variant, the rows of the panel's
      # « Réglages » › « Filtration et hors gel » and of the controller's own page (the same, in its Réglages),
      # for a dashboard that wants them outside the pop-up, with a line under each name saying what it does. Home
      # Assistant's entities card would cut the long names short on a phone and has no such line. The four
      # filtration-length settings wait for « Appliquer » (they reshape today's plan); the others apply at once.
      - type: grid
        cards:
          - type: custom:piscine-card
            variant: settings
            grid_options: {columns: full}
            entities: *pool

      # ── Component: today's plan and the controller ─────────────────────────────────────────────────
      - type: grid
        cards:
          - type: entities
            title: "Plan de hoy"
            grid_options: {columns: full}
            entities:
              - entity: sensor.pool_controller_planned_filtration_hours
                name: "Filtración planificada"
              - entity: sensor.pool_controller_filtration_hours_today
                name: "Filtración real"
              - entity: sensor.pool_controller_schedule_block_1_start
                name: "Bloque 1, inicio"
              - entity: sensor.pool_controller_schedule_block_1_end
                name: "Bloque 1, fin"
              - entity: sensor.pool_controller_schedule_block_2_start
                name: "Bloque 2, inicio"
              - entity: sensor.pool_controller_schedule_block_2_end
                name: "Bloque 2, fin"
              - entity: sensor.pool_controller_next_speed_change
                name: "Próximo cambio de velocidad"
              - entity: sensor.pool_controller_next_planned_speed
                name: "Siguiente velocidad"
              - entity: sensor.pool_controller_last_recomputed_at
                name: "Plan calculado a las"
              - entity: button.pool_controller_recompute_schedule_now
                name: "Recalcular el plan"
          - type: entities
            title: "Controlador"
            grid_options: {columns: full}
            entities:
              - entity: binary_sensor.pool_controller_status
                name: "Enlace a Home Assistant"
              - entity: sensor.pool_controller_pump_commanded_speed
                name: "Velocidad de la bomba"
              - entity: sensor.pool_controller_pump_planned_speed
                name: "Velocidad planificada"
              - entity: sensor.pool_controller_pool_return_temperature
                name: "Sonda de retorno del filtro"
              - entity: sensor.pool_controller_equipment_pad_temperature
                name: "Cuarto de equipos"
              - entity: sensor.pool_controller_outdoor_temperature
                name: "Exterior"
              - entity: button.pool_controller_update_temperature_sensors_now
                name: "Volver a leer las sondas"
              - entity: sensor.pool_controller_wifi_signal
                name: "Señal Wi-Fi"
              - entity: sensor.pool_controller_wifi_disconnects
                name: "Desconexiones de Wi‑Fi"
