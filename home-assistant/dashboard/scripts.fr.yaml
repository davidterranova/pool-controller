# Generated by make ha-files from scripts.tmpl.yaml (fr): edit that template or home-assistant/i18n-yaml/fr.json, then make ha-files. Never edit this file.
# The two Home Assistant scripts piscine-card calls (see README.md here). They only set the controller's
# Manual Override select and its timeout; the controller does the rest (freeze protection first, the
# override's own expiry, back to Auto). Entity ids are a fresh install's: see README.md, « Entity ids ».
#
# Paste into Home Assistant's scripts.yaml, or create each one in Settings → Automations & scenes →
# Scripts → ⋮ → Edit in YAML (the key below is the script's id).
#
# The ids, the fields and the speeds' values are the card's API: the same in every language, never translated.
# Only the texts a person reads are.

piscine_forcer_vitesse:
  alias: "Piscine — forcer une vitesse"
  description: "Force la pompe de la piscine sur une vitesse, par le select Manual Override du contrôleur. Le contrôleur met fin lui-même au forçage après Manual Override Timeout minutes (0 = jamais) ; passer `duree` pour régler d'abord ce délai."
  icon: mdi:pump
  mode: queued
  max: 3
  fields:
    vitesse:
      name: "Vitesse"
      description: "La vitesse à forcer. En YAML, sa valeur est Off, Low, Medium ou High, quelle que soit la langue."
      required: true
      selector:
        select:
          options:
            - {value: "Off", label: "Arrêt"}
            - {value: "Low", label: "Basse"}
            - {value: "Medium", label: "Moyenne"}
            - {value: "High", label: "Haute"}
    duree:
      name: "Durée (min)"
      description: "Minutes avant le retour en Auto, 0 = jamais. Vide : la durée déjà réglée sur le contrôleur."
      required: false
      selector:
        number: {min: 0, max: 480, step: 5, unit_of_measurement: min, mode: box}
  sequence:
    - if:
        # optional field: no native condition can test whether a script variable was passed
        - condition: template
          value_template: "{{ duree is defined }}"
      then:
        - action: number.set_value
          target: {entity_id: number.pool_controller_manual_override_timeout}
          data: {value: "{{ duree }}"}
    - action: select.select_option
      target: {entity_id: select.pool_controller_manual_override}
      data: {option: "{{ vitesse }}"}

piscine_retour_auto:
  alias: "Piscine — retour en Auto"
  description: "Rend la pompe au plan autonome du contrôleur (Manual Override → Auto)."
  icon: mdi:autorenew
  mode: single
  max_exceeded: silent
  sequence:
    - action: select.select_option
      target: {entity_id: select.pool_controller_manual_override}
      data: {option: "Auto"}
