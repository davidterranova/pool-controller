# Generated by make ha-files from scripts.tmpl.yaml (en): edit that template or home-assistant/i18n-yaml/en.json, then make ha-files. Never edit this file.
# The two Home Assistant scripts piscine-card calls (see README.md here). They only set the controller's
# Manual Override select and its timeout; the controller does the rest (freeze protection first, the
# override's own expiry, back to Auto). Entity ids are a fresh install's: see README.md, « Entity ids ».
#
# Paste into Home Assistant's scripts.yaml, or create each one in Settings → Automations & scenes →
# Scripts → ⋮ → Edit in YAML (the key below is the script's id).
#
# The ids, the fields and the speeds' values are the card's API: the same in every language, never translated.
# Only the texts a person reads are.

piscine_forcer_vitesse:
  alias: "Pool — force a speed"
  description: "Forces the pool pump to one speed through the controller's Manual Override select. The controller ends the override itself after Manual Override Timeout minutes (0 = never); pass `duree` to set that timeout first."
  icon: mdi:pump
  mode: queued
  max: 3
  fields:
    vitesse:
      name: "Speed"
      description: "The speed to force. In YAML, its value is Off, Low, Medium or High, whatever the language."
      required: true
      selector:
        select:
          options:
            - {value: "Off", label: "Off"}
            - {value: "Low", label: "Low"}
            - {value: "Medium", label: "Medium"}
            - {value: "High", label: "High"}
    duree:
      name: "Duration (min)"
      description: "Minutes before going back to Auto, 0 = never. Empty: the duration already set on the controller."
      required: false
      selector:
        number: {min: 0, max: 480, step: 5, unit_of_measurement: min, mode: box}
  sequence:
    - if:
        # optional field: no native condition can test whether a script variable was passed
        - condition: template
          value_template: "{{ duree is defined }}"
      then:
        - action: number.set_value
          target: {entity_id: number.pool_controller_manual_override_timeout}
          data: {value: "{{ duree }}"}
    - action: select.select_option
      target: {entity_id: select.pool_controller_manual_override}
      data: {option: "{{ vitesse }}"}

piscine_retour_auto:
  alias: "Pool — back to Auto"
  description: "Hands the pump back to the controller's autonomous plan (Manual Override → Auto)."
  icon: mdi:autorenew
  mode: single
  max_exceeded: silent
  sequence:
    - action: select.select_option
      target: {entity_id: select.pool_controller_manual_override}
      data: {option: "Auto"}
