# The controller's own settings, set at run time and kept in NVS, instead of
# compiled in from secrets.yaml: so one firmware, built by CI, fits every
# controller. Included by pool-controller.yaml (packages: device_settings);
# its C++ helpers are in device_settings.h. See
# docs/plans/secret-free-firmware.md for the design and its entity contract.
#
# What a controller is set up with, and where each value lives:
#   Page Password    page_password            the page's login screen
#                                             (components/page_login); none =
#                                             setup mode, no login
#   OTA Password     ota_password             random at first boot, so OTA is
#                                             never open
#   API Key          ESPHome's own Noise PSK  Home Assistant sets it when it
#                                             pairs; else pasted (API Key) or
#                                             generated, never shown (Generate
#                                             API Key); Forget API Key clears it
#   Wi-Fi            ESPHome's saved network  Improv serial, or the page's
#                                             « Join WiFi Network »
#   Latitude/Longitude  latitude, longitude   sunrise/sunset of the plan
#   Timezone         timezone_posix           local time (POSIX TZ string)
#   Timezone Name    timezone_name            the IANA name, display only
#   Pool/Pad/Outdoor Probe  *_probe_address   which DS18B20 is which
#
# GLOBAL IDS ARE STABLE FOREVER. A restored global's NVS key is the md5 of its
# id, so renaming one (or changing its type or size) silently loses what every
# controller has stored: page_password, ota_password, latitude, longitude,
# timezone_posix, timezone_name, pool_probe_address, pad_probe_address,
# outdoor_probe_address.
#
# Secrets are never entity states: a text in password mode still sends its
# raw value to every page and to Home Assistant (CVE-2026-71260), so Page
# Password, OTA Password and API Key only write a global (or the API's key)
# and publish nothing. Whether each is set shows in Setup State.
#
# Factory Reset forgets access (page and OTA passwords, the page's sessions,
# the API key) and the saved Wi-Fi, keeps everything else (the probes' roles, the position, both
# timezone entities, the filtration and freeze settings, the history), then
# reboots into setup mode. Not ESPHome's factory_reset platform: it erases all
# of NVS, filtration history and settings included.

external_components:
  - source:
      type: local
      path: components
    components: [page_login]

# The page's login screen and sessions (docs/plans/page-login.md). It has its
# password from page_password (on_boot, Page Password) and keeps its sessions
# in NVS itself. pool-controller.yaml's web_server has no `auth:`: this gate
# replaces it.
page_login:
  id: page_login_gate
  idle_timeout: 6h

esphome:
  includes:
    - device_settings.h
  on_boot:
    # After globals restore (HARDWARE, 800) and the one_wire bus scan (BUS,
    # 1000); before dallas_temp (DATA, 600), OTA and web_server (WIFI - 1,
    # 249), so every value is in place before what uses it starts.
    - priority: 700
      then:
        - lambda: |-
            // Page login: none stored = setup mode.
            id(page_login_gate).set_password(id(page_password));
            // OTA: never open. A random password until one is set.
            if (id(ota_password).empty()) {
              id(ota_password) = pool_settings::random_password();
              ESP_LOGI("settings", "OTA password: none set, a random one until there is");
            }
            id(ota_esphome).set_auth_password(id(ota_password));
            // Position and timezone.
            if (pool_settings::position_set(id(latitude), id(longitude))) {
              id(sun_id).set_latitude(id(latitude));
              id(sun_id).set_longitude(id(longitude));
            }
            if (!pool_settings::apply_timezone(id(timezone_posix)) && !id(timezone_posix).empty())
              ESP_LOGW("settings", "Stored timezone '%s' doesn't parse; using UTC", id(timezone_posix).c_str());
            // Probes: each role's address before dallas_temp reads it.
            if (id(pool_probe_address) != 0) id(pool_return_temp).set_address(id(pool_probe_address));
            if (id(pad_probe_address) != 0) id(pad_ambient_temp).set_address(id(pad_probe_address));
            if (id(outdoor_probe_address) != 0) id(outdoor_temp).set_address(id(outdoor_probe_address));
            id(probe_options_update).execute();
    # Right after dallas_temp's setup: with a single probe on the bus, a
    # sensor with no address takes that one. A role with no probe reads
    # unknown instead.
    - priority: 590
      then:
        - lambda: |-
            if (id(pool_probe_address) == 0) id(pool_return_temp).set_address(0);
            if (id(pad_probe_address) == 0) id(pad_ambient_temp).set_address(0);
            if (id(outdoor_probe_address) == 0) id(outdoor_temp).set_address(0);
    # The values of the settings entities that read a global (their lambdas
    # don't poll: they are updated when set).
    - priority: -200
      then:
        - component.update: latitude_number
        - component.update: longitude_number
        - component.update: timezone_text
        - component.update: timezone_name_text
        - script.execute: probes_read

web_server:
  sorting_groups:
    - id: grp_device
      name: "Device Settings"
      sorting_weight: 60

globals:
  # See the header: these ids never change.
  - id: page_password
    type: std::string
    restore_value: true
    max_restore_data_length: 65  # 64 characters + the length byte
    initial_value: '""'
  - id: ota_password
    type: std::string
    restore_value: true
    max_restore_data_length: 65
    initial_value: '""'
  # Degrees, rounded to 0.01; NAN = not set.
  - id: latitude
    type: double
    restore_value: true
    initial_value: 'NAN'
  - id: longitude
    type: double
    restore_value: true
    initial_value: 'NAN'
  # POSIX TZ, e.g. "CET-1CEST,M3.5.0,M10.5.0/3"; "" = not set (UTC meanwhile).
  - id: timezone_posix
    type: std::string
    restore_value: true
    max_restore_data_length: 65
    initial_value: '""'
  # The IANA name the zone above came from ("Europe/Paris"), for display.
  - id: timezone_name
    type: std::string
    restore_value: true
    max_restore_data_length: 65
    initial_value: '""'
  # A DS18B20 per role, as ESPHome's `address:`; 0 = none.
  - id: pool_probe_address
    type: uint64_t
    restore_value: true
    initial_value: '0'
  - id: pad_probe_address
    type: uint64_t
    restore_value: true
    initial_value: '0'
  - id: outdoor_probe_address
    type: uint64_t
    restore_value: true
    initial_value: '0'

script:
  # Every settings write ends here. Setup State is republished at once (the
  # setup wizard follows it, rather than its 10 s poll). Then the setting is
  # committed: a restored global is written to NVS by its own 1 s poll, and
  # NVS commits every flash_write_interval (5 min, see pool-controller.yaml),
  # so a power cut right after setting it would lose it.
  - id: settings_save
    mode: restart
    then:
      - component.update: setup_state
      - delay: 2s
      - lambda: 'global_preferences->sync();'

  # The role selects' options: « none », the probes on the bus, and any
  # address a role holds that the bus didn't answer for.
  - id: probe_options_update
    then:
      - lambda: |-
          select::Select *selects[] = {id(pool_probe_select), id(pad_probe_select), id(outdoor_probe_select)};
          uint64_t roles[] = {id(pool_probe_address), id(pad_probe_address), id(outdoor_probe_address)};
          pool_settings::set_probe_options(id(probe_bus), selects, roles, 3);

  # Detected Probes: every probe converts at once, then each is read by
  # address, roles or not, so the page can tell which is which.
  - id: probes_read
    mode: single
    then:
      - lambda: 'pool_settings::start_conversion(id(probe_bus));'
      - delay: 800ms  # 12-bit conversion: 750 ms
      - lambda: |-
          uint64_t roles[] = {id(pool_probe_address), id(pad_probe_address), id(outdoor_probe_address)};
          id(detected_probes).publish_state(pool_settings::read_probes(id(probe_bus), roles, 3));

  # A role changed: the sensor reads its new probe now, or unknown for none.
  # Each address has one role at most: taking one from another role clears
  # that one.
  - id: probe_role_set
    parameters:
      role: int  # 0 pool, 1 pad, 2 outdoor
      option: string
    then:
      - lambda: |-
          uint64_t address = pool_settings::parse_address(option);
          uint64_t *roles[] = {&id(pool_probe_address), &id(pad_probe_address), &id(outdoor_probe_address)};
          dallas_temp::DallasTemperatureSensor *sensors[] = {id(pool_return_temp), id(pad_ambient_temp), id(outdoor_temp)};
          const char *names[] = {"Pool", "Pad", "Outdoor"};
          for (int i = 0; i < 3; i++) {
            bool mine = i == role;
            if (!mine && (address == 0 || *roles[i] != address)) continue;
            uint64_t next = mine ? address : 0;
            if (*roles[i] == next) continue;
            *roles[i] = next;
            sensors[i]->set_address(next);
            if (next == 0) sensors[i]->publish_state(NAN);
            else sensors[i]->update();
            ESP_LOGI("settings", "%s probe: %s", names[i], next == 0 ? "none" : pool_settings::format_address(next).c_str());
          }
      - script.execute: probe_options_update
      - script.execute: settings_save

  # Position or timezone changed: today's plan is recomputed with it.
  - id: plan_settings_changed
    then:
      - lambda: 'id(sched_computed_day) = -1;'
      - script.execute: evaluate_speed
      - component.update: schedule_waiting_for
      - script.execute: settings_save

text_sensor:
  # `configured`, or what is still missing, comma-separated, in the setup
  # wizard's order: page_password, wifi, position (latitude, longitude and
  # timezone), probes (the pool probe: the schedule and freeze protection
  # read it), api_key (Home Assistant sets it when it pairs).
  - platform: template
    name: "Setup State"
    id: setup_state
    web_server: {sorting_group_id: grp_device, sorting_weight: 10}
    icon: mdi:clipboard-check-outline
    entity_category: diagnostic
    update_interval: 10s
    lambda: |-
      std::string out;
      auto missing = [&](const char *item) {
        if (!out.empty()) out += ",";
        out += item;
      };
      if (id(page_password).empty()) missing("page_password");
      if (!wifi::global_wifi_component->has_sta()) missing("wifi");
      if (!pool_settings::position_set(id(latitude), id(longitude)) || id(timezone_posix).empty()) missing("position");
      if (id(pool_probe_address) == 0) missing("probes");
      if (!api::global_api_server->get_noise_ctx().has_psk()) missing("api_key");
      return out.empty() ? std::string("configured") : out;
  # "52000000518fe928: 26.4, ff00000026007028: 21.8": the probes on the bus
  # (and any a role holds that didn't answer: `--`), with their reading.
  # Refreshed every minute and by Rescan Probes.
  - platform: template
    name: "Detected Probes"
    id: detected_probes
    web_server: {sorting_group_id: grp_device, sorting_weight: 60}
    icon: mdi:thermometer-lines
    entity_category: diagnostic
  # Why today's plan isn't computed yet: position, timezone, clock, pool
  # probe, pool temperature or sunrise/sunset; `--` once it is. Pairs with
  # Schedule Not Computed.
  - platform: template
    name: "Schedule Waiting For"
    id: schedule_waiting_for
    web_server: {sorting_group_id: grp_plan, sorting_weight: 125}
    icon: mdi:calendar-question
    entity_category: diagnostic
    update_interval: 30s
    lambda: |-
      auto now = id(local_time).now();
      const char *reason = pool_settings::schedule_wait_reason(
          id(latitude), id(longitude), id(timezone_posix), now.is_valid(),
          now.is_valid() && now.day_of_year == id(sched_computed_day),
          id(pool_probe_address) != 0, id(pool_return_temp).state);
      return std::string(reason != nullptr ? reason : "--");

text:
  # Write-only: the password goes to page_password, the entity never holds
  # it. It applies at once, no reboot, and ends every session: the page that
  # set it logs in again with it.
  - platform: template
    name: "Page Password"
    web_server: {sorting_group_id: grp_device, sorting_weight: 20}
    icon: mdi:form-textbox-password
    entity_category: config
    mode: password
    min_length: 8
    max_length: 64
    set_action:
      - lambda: |-
          id(page_password) = x;
          id(page_login_gate).set_password(id(page_password));
          id(page_login_gate).logout_all();
          ESP_LOGI("settings", "Page password set; every session ended, the page now asks for it");
      - script.execute: settings_save
  # Write-only, like Page Password. It guards plaintext uploads (`make ota`);
  # with an API key set, Home Assistant's OTA uses the key instead.
  - platform: template
    name: "OTA Password"
    web_server: {sorting_group_id: grp_device, sorting_weight: 30}
    icon: mdi:upload-lock
    entity_category: config
    mode: password
    min_length: 8
    max_length: 64
    set_action:
      - lambda: |-
          id(ota_password) = x;
          id(ota_esphome).set_auth_password(x);
          ESP_LOGI("settings", "OTA password set");
      - script.execute: settings_save
  # Write-only. Home Assistant sets the key itself when it pairs; this is for
  # a key pasted from elsewhere (a controller moving to this firmware keeps
  # its old one). Base64 of 32 bytes, as Home Assistant shows it; the all-zero
  # key is refused. Saving it drops every API client, which reconnects with
  # the key.
  - platform: template
    name: "API Key"
    web_server: {sorting_group_id: grp_device, sorting_weight: 40}
    icon: mdi:key-variant
    entity_category: config
    mode: password
    min_length: 44
    max_length: 44
    set_action:
      - lambda: |-
          noise::psk_t psk;
          if (!pool_settings::decode_api_key(x, psk)) {
            ESP_LOGW("settings", "API key refused: not base64 of 32 bytes, or all zero");
            return;
          }
          bool ok = api::global_api_server->save_noise_psk(psk, true);
          ESP_LOGI("settings", "API key %s", ok ? "saved" : "NOT saved");
      # ESPHome applies a saved key 100 ms later (has_psk() then says so).
      - delay: 200ms
      - component.update: setup_state
  # POSIX TZ string ("CET-1CEST,M3.5.0,M10.5.0/3"): the page and the card
  # convert the IANA zone. Refused if it doesn't parse.
  - platform: template
    name: "Timezone"
    id: timezone_text
    web_server: {sorting_group_id: grp_device, sorting_weight: 52}
    icon: mdi:map-clock-outline
    entity_category: config
    mode: text
    max_length: 64
    update_interval: never
    lambda: 'return id(timezone_posix);'
    set_action:
      - lambda: |-
          esphome::time::ParsedTimezone tz{};
          if (!pool_settings::parse_posix_tz(x, tz)) {
            ESP_LOGW("settings", "Timezone refused, not a POSIX TZ string: '%s'", x.c_str());
            return;
          }
          id(timezone_posix) = x;
          pool_settings::apply_timezone(id(timezone_posix));
          ESP_LOGI("settings", "Timezone: %s", x.c_str());
      - component.update: timezone_text
      - script.execute: plan_settings_changed
  # The IANA name of the zone above ("Europe/Paris"), set with it by the page
  # or the card: shown, never used to compute anything.
  - platform: template
    name: "Timezone Name"
    id: timezone_name_text
    web_server: {sorting_group_id: grp_device, sorting_weight: 53}
    icon: mdi:earth
    entity_category: config
    mode: text
    max_length: 64
    update_interval: never
    lambda: 'return id(timezone_name);'
    set_action:
      - lambda: |-
          if (!pool_settings::valid_zone_name(x)) {
            ESP_LOGW("settings", "Timezone name refused: '%s'", x.c_str());
            return;
          }
          id(timezone_name) = x;
      - component.update: timezone_name_text
      - script.execute: settings_save

number:
  # The pool's position for sunrise/sunset, to the hundredth of a degree
  # (about 1 km). Unknown until set: the schedule waits for both.
  - platform: template
    name: "Latitude"
    id: latitude_number
    web_server: {sorting_group_id: grp_device, sorting_weight: 50}
    icon: mdi:latitude
    entity_category: config
    unit_of_measurement: "°"
    mode: box
    min_value: -90
    max_value: 90
    step: 0.01
    update_interval: never
    lambda: 'return id(latitude);'
    set_action:
      - lambda: |-
          id(latitude) = pool_settings::round_degrees(x);
          if (pool_settings::position_set(id(latitude), id(longitude))) {
            id(sun_id).set_latitude(id(latitude));
            id(sun_id).set_longitude(id(longitude));
          }
      - component.update: latitude_number
      - script.execute: plan_settings_changed
  - platform: template
    name: "Longitude"
    id: longitude_number
    web_server: {sorting_group_id: grp_device, sorting_weight: 51}
    icon: mdi:longitude
    entity_category: config
    unit_of_measurement: "°"
    mode: box
    min_value: -180
    max_value: 180
    step: 0.01
    update_interval: never
    lambda: 'return id(longitude);'
    set_action:
      - lambda: |-
          id(longitude) = pool_settings::round_degrees(x);
          if (pool_settings::position_set(id(latitude), id(longitude))) {
            id(sun_id).set_latitude(id(latitude));
            id(sun_id).set_longitude(id(longitude));
          }
      - component.update: longitude_number
      - script.execute: plan_settings_changed

select:
  # Which probe is which: « none » or one of Detected Probes' addresses. The
  # options, and each select's state, are set at boot and after a change or a
  # rescan (probe_options_update); Home Assistant sees options a rescan added
  # once it reconnects.
  - platform: template
    name: "Pool Probe"
    id: pool_probe_select
    web_server: {sorting_group_id: grp_device, sorting_weight: 61}
    icon: mdi:pool-thermometer
    entity_category: config
    options: ["none"]
    set_action:
      - script.execute: {id: probe_role_set, role: 0, option: !lambda 'return x.str();'}
  - platform: template
    name: "Pad Probe"
    id: pad_probe_select
    web_server: {sorting_group_id: grp_device, sorting_weight: 62}
    icon: mdi:thermometer
    entity_category: config
    options: ["none"]
    set_action:
      - script.execute: {id: probe_role_set, role: 1, option: !lambda 'return x.str();'}
  - platform: template
    name: "Outdoor Probe"
    id: outdoor_probe_select
    web_server: {sorting_group_id: grp_device, sorting_weight: 63}
    icon: mdi:sun-thermometer-outline
    entity_category: config
    options: ["none"]
    set_action:
      - script.execute: {id: probe_role_set, role: 2, option: !lambda 'return x.str();'}

button:
  # For a controller used without Home Assistant (« Je n'utilise pas Home
  # Assistant »): a random key the controller keeps and nobody sees, so the
  # API is closed. Ignored when a key is already set: Forget API Key first.
  - platform: template
    name: "Generate API Key"
    web_server: {sorting_group_id: grp_device, sorting_weight: 41}
    icon: mdi:key-plus
    entity_category: config
    on_press:
      - lambda: |-
          if (api::global_api_server->get_noise_ctx().has_psk()) {
            ESP_LOGW("settings", "Generate API Key: a key is already set; Forget API Key first");
            return;
          }
          noise::psk_t psk;
          if (!pool_settings::random_api_key(psk)) {
            ESP_LOGE("settings", "Generate API Key: no random bytes, nothing saved");
            return;
          }
          bool ok = api::global_api_server->save_noise_psk(psk, true);
          ESP_LOGI("settings", "API key generated and %s", ok ? "saved" : "NOT saved");
      - delay: 200ms  # applied 100 ms after saving, as for API Key
      - component.update: setup_state
  # Back to no key (the API open on the LAN, as before pairing), to hand the
  # controller to Home Assistant, which then sets its own. Drops every API
  # client.
  - platform: template
    name: "Forget API Key"
    web_server: {sorting_group_id: grp_device, sorting_weight: 42}
    icon: mdi:key-remove
    entity_category: config
    on_press:
      - lambda: |-
          bool ok = api::global_api_server->clear_noise_psk(true);
          ESP_LOGI("settings", "API key %s", ok ? "forgotten" : "NOT forgotten");
      - delay: 200ms  # applied 100 ms after clearing, as for API Key
      - component.update: setup_state
  # Ends every session of the page, on every browser: each then shows the
  # login screen. The page that pressed it too.
  - platform: template
    name: "Logout All Devices"
    id: logout_all_devices
    web_server: {sorting_group_id: grp_device, sorting_weight: 25}
    icon: mdi:logout
    entity_category: config
    on_press:
      - lambda: 'id(page_login_gate).logout_all();'
  # Scans the bus again (a probe added or swapped), then refreshes the
  # selects' options and Detected Probes.
  - platform: template
    name: "Rescan Probes"
    web_server: {sorting_group_id: grp_device, sorting_weight: 64}
    icon: mdi:magnify-scan
    entity_category: config
    on_press:
      - lambda: |-
          id(probe_bus).search();
          ESP_LOGI("settings", "Probe scan: %u on the bus", (unsigned) id(probe_bus).get_devices().size());
      - script.execute: probe_options_update
      - script.execute: probes_read
  # Restarts the controller, keeping everything (ESPHome's safe reboot saves
  # the restored values first). It comes back in Auto: Manual Override is
  # never restored. The page and the card ask for a confirmation first.
  - platform: restart
    name: "Restart"
    web_server: {sorting_group_id: grp_device, sorting_weight: 85}
    icon: mdi:restart
    entity_category: config
  # Forgets access and the network, keeps the pool's settings, reboots into
  # setup mode (see the header). The page asks for a confirmation first.
  - platform: template
    name: "Factory Reset"
    web_server: {sorting_group_id: grp_device, sorting_weight: 90}
    icon: mdi:restart-alert
    entity_category: config
    on_press:
      - lambda: |-
          ESP_LOGW("settings", "Factory reset: forgetting the page and OTA passwords, the page's sessions, the API key and the saved Wi-Fi");
          id(page_password).clear();
          id(page_login_gate).set_password(id(page_password));
          id(page_login_gate).logout_all();
          id(ota_password) = pool_settings::random_password();
          id(ota_esphome).set_auth_password(id(ota_password));
          api::global_api_server->clear_noise_psk(true);
          pool_settings::forget_wifi();
      # Let the globals' 1 s poll (and page_login's loop) write them, then
      # commit and reboot.
      - delay: 2s
      - lambda: |-
          global_preferences->sync();
          App.safe_reboot();

interval:
  - interval: 60s
    then:
      - script.execute: probes_read
