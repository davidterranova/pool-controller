# Proposed: Wi-Fi setup and statistics for the device's own page.
#
# NOT part of the firmware yet. pool-controller.yaml doesn't include it; the
# local mock loads it next to pool-controller.yaml (`make mock-webui`) so the
# page can be designed against these entities first. To adopt it, add to
# pool-controller.yaml:
#
#   packages:
#     wifi_setup: !include wifi-setup.yaml
#
# and drop `reboot_timeout: 15min` from its wifi: block (see the interval
# below for why).
#
# What it adds:
#   - a fallback hotspot, "pool-controller", started after 1 min without a
#     Wi-Fi connection: a new device with no network, a router outage, a
#     changed password. The device's page (web_server, still behind its
#     login) answers on it at http://192.168.4.1.
#     Deliberately NOT ESPHome's captive_portal: while the hotspot is up it
#     answers every GET request itself, without auth, so the page would be
#     unreachable on the hotspot.
#   - a way to join a network from the page: New WiFi Network + New WiFi
#     Password, then Join WiFi Network (wifi.configure: tries it, saves it on
#     success; a saved network takes precedence over the one built in).
#   - Wi-Fi statistics: signal, network, router (BSSID), addresses, networks
#     nearby, disconnections since boot, devices on the hotspot.
#   - Device Clock, settable from the page: on the hotspot alone there's no
#     internet, so no SNTP time, so no daily plan. The page sends the phone's
#     time when Clock Source says "None".

esphome:
  includes:
    - <esp_wifi.h>  # esp_wifi_ap_get_sta_list, for Hotspot Clients

wifi:
  ap:
    ssid: "pool-controller"
    # Open, as asked: joining it gives nothing without the web_server login
    # (and api/ota have their own keys). Anyone in range can still join and
    # try that login; a WPA2 password here would stop that:
    # password: !secret pool_controller_ap_password
    ap_timeout: 1min
  on_disconnect:
    - lambda: 'id(wifi_disconnects) += 1;'

time:
  - id: !extend local_time
    on_time_sync:
      - lambda: 'id(clock_source) = "SNTP";'

web_server:
  sorting_groups:
    - id: grp_wifi
      name: "Wi-Fi"
      sorting_weight: 50

globals:
  - id: wifi_disconnects
    type: uint32_t
    restore_value: false
    initial_value: '0'
  # Held here, never published: a text entity in password mode masks its
  # `state` but still sends the raw `value` to every page and to HA.
  - id: wifi_join_password
    type: std::string
    restore_value: false
    initial_value: '""'
  # Where the clock came from: "SNTP", "Browser" (Device Clock set from the
  # page) or "None" (not set since boot).
  - id: clock_source
    type: std::string
    restore_value: false
    initial_value: '"None"'

sensor:
  - platform: wifi_signal
    name: "WiFi Signal"
    web_server: {sorting_group_id: grp_wifi, sorting_weight: 20}
    entity_category: diagnostic
    update_interval: 30s
  - platform: template
    name: "WiFi Disconnects"
    web_server: {sorting_group_id: grp_wifi, sorting_weight: 60}
    icon: mdi:wifi-alert
    entity_category: diagnostic
    accuracy_decimals: 0
    update_interval: 60s
    lambda: 'return id(wifi_disconnects);'
  - platform: template
    name: "Hotspot Clients"
    id: hotspot_clients
    web_server: {sorting_group_id: grp_wifi, sorting_weight: 70}
    icon: mdi:access-point
    entity_category: diagnostic
    accuracy_decimals: 0
    update_interval: 15s
    lambda: |-
      if (!wifi::global_wifi_component->is_ap_active()) return 0;
      wifi_sta_list_t list;
      return esp_wifi_ap_get_sta_list(&list) == ESP_OK ? list.num : 0;

text_sensor:
  - platform: template
    name: "WiFi Mode"
    web_server: {sorting_group_id: grp_wifi, sorting_weight: 10}
    icon: mdi:wifi-cog
    entity_category: diagnostic
    update_interval: 5s
    lambda: |-
      if (wifi::global_wifi_component->is_connected()) return std::string("Connected");
      if (wifi::global_wifi_component->is_ap_active()) return std::string("Hotspot");
      return std::string("Connecting");
  - platform: wifi_info
    ssid:
      name: "WiFi SSID"
      web_server: {sorting_group_id: grp_wifi, sorting_weight: 30}
    bssid:
      name: "WiFi BSSID"
      web_server: {sorting_group_id: grp_wifi, sorting_weight: 40}
    ip_address:
      name: "IP Address"
      web_server: {sorting_group_id: grp_wifi, sorting_weight: 50}
    mac_address:
      name: "MAC Address"
      web_server: {sorting_group_id: grp_wifi, sorting_weight: 55}
    # "SSID: -58dB\n" per network, strongest first, hidden ones left out.
    scan_results:
      name: "WiFi Networks Nearby"
      web_server: {sorting_group_id: grp_wifi, sorting_weight: 80}
  - platform: template
    name: "Clock Source"
    web_server: {sorting_group_id: grp_wifi, sorting_weight: 100}
    icon: mdi:clock-check-outline
    entity_category: diagnostic
    update_interval: 10s
    lambda: 'return id(clock_source);'

text:
  - platform: template
    name: "New WiFi Network"
    id: wifi_join_ssid
    web_server: {sorting_group_id: grp_wifi, sorting_weight: 85}
    icon: mdi:wifi-plus
    entity_category: config
    mode: text
    max_length: 32
    optimistic: true
  - platform: template
    name: "New WiFi Password"
    web_server: {sorting_group_id: grp_wifi, sorting_weight: 86}
    icon: mdi:form-textbox-password
    entity_category: config
    mode: password
    max_length: 64
    set_action:
      - lambda: 'id(wifi_join_password) = x;'

button:
  - platform: template
    name: "Join WiFi Network"
    web_server: {sorting_group_id: grp_wifi, sorting_weight: 87}
    icon: mdi:wifi-arrow-right
    entity_category: config
    on_press:
      - logger.log:
          format: "Wi-Fi: joining '%s'"
          args: ['id(wifi_join_ssid).state.c_str()']
      - wifi.configure:
          ssid: !lambda 'return id(wifi_join_ssid).state;'
          password: !lambda 'return id(wifi_join_password);'
          save: true
          timeout: 30s
          on_connect:
            - logger.log: "Wi-Fi: joined and saved"
          on_error:
            - logger.log:
                level: WARN
                format: "Wi-Fi: couldn't join '%s', keeping the previous network"
                args: ['id(wifi_join_ssid).state.c_str()']
      - lambda: 'id(wifi_join_password).clear();'

datetime:
  - platform: template
    type: datetime
    name: "Device Clock"
    web_server: {sorting_group_id: grp_wifi, sorting_weight: 90}
    icon: mdi:clock-edit-outline
    entity_category: config
    update_interval: 60s
    lambda: |-
      auto now = id(local_time).now();
      if (!now.is_valid()) return {};
      return now;
    set_action:
      - lambda: |-
          ESPTime t = x;
          t.recalc_timestamp_local();
          struct timeval tv = {.tv_sec = t.timestamp, .tv_usec = 0};
          settimeofday(&tv, nullptr);
          id(clock_source) = "Browser";
          ESP_LOGI("clock", "Set from the page: %04d-%02d-%02d %02d:%02d:%02d",
                   t.year, t.month, t.day_of_month, t.hour, t.minute, t.second);

interval:
  # Replaces wifi: reboot_timeout, which ESPHome turns off once a hotspot is
  # configured: reboot after 15 min without Wi-Fi (the stuck-radio recovery),
  # but only when there's a network to get back to and nobody is using the
  # hotspot.
  - interval: 1min
    then:
      - lambda: |-
          static uint32_t down_since = 0;
          auto *w = wifi::global_wifi_component;
          if (w->is_connected() || !w->has_sta()) { down_since = 0; return; }
          if (down_since == 0) down_since = millis();
          if (id(hotspot_clients).state > 0) return;
          if (millis() - down_since > 15 * 60 * 1000UL) {
            ESP_LOGE("wifi", "No Wi-Fi for 15 min and nobody on the hotspot; rebooting");
            App.safe_reboot();
          }
