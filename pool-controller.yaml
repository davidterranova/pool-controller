esphome:
  name: pool-controller
  friendly_name: Pool Controller
  # The "Pump" fan entity below (see fan:) has no restore/initial state of
  # its own, so it always boots into a default "off" state -- and its
  # on_state handler unconditionally syncs that into Manual Override,
  # which would silently clobber Manual Override's own "Auto" boot default
  # (see select: below) the instant the fan's initial state is established.
  # boot_guard_active suppresses that one-time startup sync; cleared a few
  # seconds after boot, once every component's own initial/restored state
  # has settled, so any *real* user interaction with the fan afterwards
  # still syncs normally.
  on_boot:
    priority: -100
    then:
      - delay: 3s
      - lambda: 'id(boot_guard_active) = false;'

esp32:
  board: esp32dev
  framework:
    type: arduino
    advanced:
      minimum_chip_revision: "3.1"
      sram1_as_iram: true

# Edit these for your wiring; everything below reads from them.
substitutions:
  relay_v1_pin: GPIO26    # Relay 1 -> pump DI1 (Speed V1)
  relay_v2_pin: GPIO25    # Relay 2 -> pump DI2 (Speed V2)
  relay_v3_pin: GPIO14    # Relay 3 -> pump DI3 (Speed V3)
  relay_run_pin: GPIO27   # Relay 4 -> pump DI4 (Run/Stop)
  onewire_pin: GPIO4

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # Reboot and retry if Wi-Fi has been down this long -- recovers from a
  # stuck radio without needing anyone to notice.
  reboot_timeout: 15min

logger:
  level: INFO

api:
  encryption:
    key: !secret pool_controller_api_key
  # ESPHome's default reboots the device if no API client (i.e. Home
  # Assistant) connects for a while -- exactly the dependency this whole
  # design exists to avoid. This device must keep running its schedule
  # with or without HA, so that safety reboot is disabled.
  reboot_timeout: 0s

ota:
  platform: esphome
  password: !secret pool_controller_ota_password

time:
  - platform: sntp
    id: local_time
    # REQUIRED for the schedule below: sunrise/sunset day-selection and the
    # once-daily recompute both key off local wall-clock fields, not just
    # the underlying UTC epoch. Without this, ESPHome's RTC defaults to
    # plain UTC with no DST.
    timezone: !secret pool_timezone
    # Falls back to your router's DHCP-advertised NTP server; add explicit
    # servers here if your network doesn't advertise one.

# Used to compute today's sunrise/sunset for the autonomous filtration
# schedule below. Latitude/longitude are treated as sensitive (reveal the
# pool's approximate location), same as the credentials above -- hence
# !secret rather than the substitutions: block.
sun:
  id: sun_id
  latitude: !secret pool_latitude
  longitude: !secret pool_longitude

one_wire:
  - platform: gpio
    pin: ${onewire_pin}

sensor:
  - platform: dallas_temp
    id: pool_return_temp
    name: "Pool Return Temperature"
    address: 0x52000000518FE928   # current bench-test sensor; was 0x1c3c01d075640128 before the swap
    filters:
      - median: {window_size: 5, send_every: 5}
  - platform: dallas_temp
    id: pad_ambient_temp
    name: "Equipment Pad Temperature"
    address: 0xFF00000026007028   # was 0x3c2c01d0756a0328 before the sensor swap
  - platform: dallas_temp
    id: outdoor_temp
    name: "Outdoor Temperature"
    address: 0xFC00000051AD2428
  # Derived live from the cached block boundaries below, not stored as its
  # own global -- can't drift out of sync with what Block 1/2 actually say,
  # and it collapses to Block 1's length automatically when they're merged
  # (Block 2 is zero-width in that case).
  - platform: template
    name: "Planned Filtration Hours"
    id: planned_filtration_hours
    icon: mdi:timer-sand
    unit_of_measurement: "h"
    accuracy_decimals: 1
    state_class: measurement
    update_interval: 60s
    lambda: |-
      return (id(sched_block1_end) - id(sched_block1_start) +
              id(sched_block2_end) - id(sched_block2_start)) / 3600.0f;

text_sensor:
  - platform: template
    name: "Pump Commanded Speed"
    id: pump_status
    icon: mdi:pump
    update_interval: 10s
    lambda: 'return id(last_commanded);'
  # "What the autonomous plan alone says right now" -- always live,
  # independent of freeze protection / manual override. Compare against Pump
  # Commanded Speed above to see plan-vs-actual divergence (a freeze event,
  # a manual override, or a boost pulse currently being overridden).
  - platform: template
    name: "Pump Planned Speed"
    id: pump_planned_speed
    icon: mdi:calendar-clock
    update_interval: 10s
    lambda: 'return id(sched_speed_now);'
  - platform: template
    name: "Schedule Block 1 Start"
    id: block1_start_display
    icon: mdi:clock-start
    update_interval: 60s
    lambda: |-
      if (id(sched_block1_start) == 0) return std::string("--:--");
      return ESPTime::from_epoch_local(id(sched_block1_start)).strftime("%H:%M");
  - platform: template
    name: "Schedule Block 1 End"
    id: block1_end_display
    icon: mdi:clock-end
    update_interval: 60s
    lambda: |-
      if (id(sched_block1_end) == 0) return std::string("--:--");
      return ESPTime::from_epoch_local(id(sched_block1_end)).strftime("%H:%M");
  # If this matches Block 2 Start, the two blocks were merged into one
  # continuous run today (see POOL-CONTROLLER.md) -- Block 2 is a real,
  # zero-width, always-off no-op in that case, not a bug.
  - platform: template
    name: "Schedule Block 2 Start"
    id: block2_start_display
    icon: mdi:clock-start
    update_interval: 60s
    lambda: |-
      if (id(sched_block2_start) == 0) return std::string("--:--");
      return ESPTime::from_epoch_local(id(sched_block2_start)).strftime("%H:%M");
  - platform: template
    name: "Schedule Block 2 End"
    id: block2_end_display
    icon: mdi:clock-end
    update_interval: 60s
    lambda: |-
      if (id(sched_block2_end) == 0) return std::string("--:--");
      return ESPTime::from_epoch_local(id(sched_block2_end)).strftime("%H:%M");
  # Look-ahead for the dashboard: when the next boost pulse (Medium, or
  # High every boost_high_every_n-th) starts/ends, computed fresh every
  # evaluate_speed tick (see Part 2b there). "--:--" once no more boosts
  # remain in today's plan.
  - platform: template
    name: "Next Boost Start"
    id: next_boost_start_display
    icon: mdi:clock-fast
    update_interval: 30s
    lambda: |-
      if (id(sched_next_boost_start) == 0) return std::string("--:--");
      return ESPTime::from_epoch_local(id(sched_next_boost_start)).strftime("%H:%M");
  - platform: template
    name: "Next Boost End"
    id: next_boost_end_display
    icon: mdi:clock-fast
    update_interval: 30s
    lambda: |-
      if (id(sched_next_boost_end) == 0) return std::string("--:--");
      return ESPTime::from_epoch_local(id(sched_next_boost_end)).strftime("%H:%M");
  # The single "when's the next speed change" answer -- earliest of today's
  # remaining block starts/ends and boost starts/ends (see Part 2c in
  # evaluate_speed). "--:--" once nothing more is scheduled today.
  - platform: template
    name: "Next Speed Change"
    id: next_change_display
    icon: mdi:clock-alert-outline
    update_interval: 30s
    lambda: |-
      if (id(sched_next_change) == 0) return std::string("--:--");
      return ESPTime::from_epoch_local(id(sched_next_change)).strftime("%H:%M");
  # What speed Next Speed Change above is changing to -- pairs with it so a
  # dashboard can show "Next change: 14:30 -> High" without the two ever
  # disagreeing (both come from the same Part 2c/2d computation). "--" once
  # nothing more is scheduled today, same gating as Next Speed Change itself.
  - platform: template
    name: "Next Planned Speed"
    id: next_planned_speed_display
    icon: mdi:speedometer
    update_interval: 30s
    lambda: |-
      if (id(sched_next_change) == 0) return std::string("--");
      return id(sched_next_planned_speed);
  # Confirms a "Recompute Schedule Now" press actually did something, even
  # on days it lands on an identical plan (see the comment in Part 1 of
  # evaluate_speed). Includes the date, not just time-of-day, since this can
  # be stale from a previous day if the sunrise/sunset lookup keeps failing.
  - platform: template
    name: "Last Recomputed At"
    id: last_recompute_display
    icon: mdi:history
    update_interval: 30s
    lambda: |-
      if (id(sched_last_recompute) == 0) return std::string("Never");
      return ESPTime::from_epoch_local(id(sched_last_recompute)).strftime("%Y-%m-%d %H:%M:%S");

# --- Autonomous schedule tunables, editable from the Home Assistant dashboard, persisted in flash ---
number:
  - platform: template
    name: "Min Filtration Hours"
    id: min_filtration_hours
    icon: mdi:timer-sand
    min_value: 0
    max_value: 24
    step: 0.5
    initial_value: 2
    restore_value: true
    optimistic: true
    on_value:
      - lambda: 'id(sched_computed_day) = -1;'
      - script.execute: evaluate_speed
  - platform: template
    name: "Max Filtration Hours"
    id: max_filtration_hours
    icon: mdi:timer-sand
    min_value: 0
    max_value: 24
    step: 0.5
    initial_value: 16
    restore_value: true
    optimistic: true
    on_value:
      - lambda: 'id(sched_computed_day) = -1;'
      - script.execute: evaluate_speed
  - platform: template
    name: "Warmest Part of Day Offset"
    id: warmest_offset_hours
    icon: mdi:sun-clock
    min_value: 0
    max_value: 6
    step: 0.25
    initial_value: 2.5
    restore_value: true
    optimistic: true
    on_value:
      - lambda: 'id(sched_computed_day) = -1;'
      - script.execute: evaluate_speed
  # Extra filtration time added on top of the temperature-derived hours,
  # for situations (e.g. algae) that call for more turnover than the
  # normal Min/Max Filtration Hours plan would give. Applied after
  # clamping, so it's additive on top of Max Filtration Hours rather
  # than absorbed by it.
  - platform: template
    name: "Filtration Hour Offset"
    id: filtration_hour_offset
    icon: mdi:timer-plus
    min_value: 0
    max_value: 6
    step: 0.5
    initial_value: 0
    restore_value: true
    optimistic: true
    on_value:
      - lambda: 'id(sched_computed_day) = -1;'
      - script.execute: evaluate_speed
  # These three intentionally do NOT reset the daily cache: evaluate_speed
  # already reads them live every tick regardless of cache state, so forcing
  # a full recompute here would just be wasted work -- and would drag in
  # whatever the live temperature happens to be, undermining the "stable
  # once-daily plan" goal, just because pulse timing was tweaked.
  - platform: template
    name: "Boost Pulse Duration"
    id: boost_duration_minutes
    icon: mdi:flash
    min_value: 0
    max_value: 15
    step: 1
    initial_value: 5
    restore_value: true
    optimistic: true
    on_value:
      - script.execute: evaluate_speed
  - platform: template
    name: "Boost Pulse Interval"
    id: boost_interval_minutes
    icon: mdi:flash-outline
    min_value: 5
    max_value: 60
    step: 5
    initial_value: 30
    restore_value: true
    optimistic: true
    on_value:
      - script.execute: evaluate_speed
  # Most boost pulses run at Medium instead of High -- the pump's power draw
  # scales roughly with speed cubed, so Medium gives most of the circulation
  # benefit for a fraction of High's energy cost. Every Nth pulse still
  # escalates to High for a stronger periodic turnover/skim. 1 reproduces
  # the old "always High" behavior.
  - platform: template
    name: "High Boost Frequency"
    id: boost_high_every_n
    icon: mdi:flash-triangle
    min_value: 1
    max_value: 10
    step: 1
    initial_value: 3
    restore_value: true
    optimistic: true
    on_value:
      - script.execute: evaluate_speed

select:
  - platform: template
    name: "Manual Override"
    id: manual_override
    options: ["Auto", "Off", "Low", "Medium", "High"]
    initial_option: "Auto"
    # Deliberately NOT restored (unlike the schedule tunables and their
    # cached daily plan above) -- a reboot from a Wi-Fi watchdog, OTA, or
    # power blip must always come back into Auto, so freeze protection and
    # the autonomous schedule are back in control on their own. Restoring a
    # stale "Off" or a fixed speed across an unattended power event would
    # silently leave the pump stuck there, unmonitored, for however long
    # until someone happens to check the dashboard.
    restore_value: false
    optimistic: true
    # React immediately instead of waiting for the next 30s interval tick --
    # overriding the pump is a "make this happen now" action, unlike the
    # schedule/freeze-protection checks below which are inherently tied to
    # the clock/temperature anyway and have nothing to react to sooner.
    on_value:
      - script.execute: evaluate_speed

button:
  - platform: template
    name: "Recompute Schedule Now"
    icon: mdi:refresh
    # Same escape hatch the Min/Max Filtration Hours and Warmest Part of Day
    # Offset numbers already use on_value: force the daily cache stale, then
    # run the same evaluate_speed tick that would otherwise only fire on a
    # real day change. Uses whatever pool_return_temp reads at press time --
    # same one-shot-then-hold-for-the-day behavior as the automatic recompute,
    # just triggered on demand instead of waiting for midnight.
    on_press:
      - lambda: 'id(sched_computed_day) = -1;'
      - script.execute: evaluate_speed
  - platform: template
    name: "Update Temperature Sensors Now"
    icon: mdi:thermometer-refresh
    # Forces an immediate DS18B20 conversion/read on all three sensors
    # instead of waiting for their own poll interval -- component.update
    # works on any PollingComponent, dallas_temp included. Useful right
    # before pressing Recompute Schedule Now, since that button's plan is
    # only as fresh as whatever Pool Return Temperature last read.
    on_press:
      - component.update: pool_return_temp
      - component.update: pad_ambient_temp
      - component.update: outdoor_temp

globals:
  - id: last_commanded
    type: std::string
    restore_value: false
    initial_value: '"unknown"'
  # Suppresses the pump_fan -> manual_override sync (see fan: on_state below)
  # while the schedule engine itself is updating the fan's displayed state --
  # otherwise every automatic speed change would yank the device out of Auto.
  - id: syncing_fan_display
    type: bool
    restore_value: false
    initial_value: 'false'
  # Suppresses the SAME pump_fan -> manual_override sync, but for the
  # opposite direction: the one-time on_state firing caused by the fan
  # entity establishing its own initial state at boot (see esphome:
  # on_boot: above and fan: on_state below), not a real user action.
  # Starts true and flips false a few seconds after boot.
  - id: boot_guard_active
    type: bool
    restore_value: false
    initial_value: 'true'

  # --- Autonomous schedule (tier 3) cache -----------------------------------
  # Computed once per calendar day from pool_return_temp + today's sunrise/
  # sunset, then held fixed for the rest of the day -- deliberately NOT
  # recomputed continuously, which would make the block boundaries an
  # unstable "moving target" as the live temperature reading drifts a few
  # tenths of a degree. restore_value: true on all five of these (unlike the
  # two globals above) is deliberate: a same-day reboot -- the WiFi watchdog
  # above, an OTA update, a power blip -- must resume the plan already
  # computed that morning, not silently recompute it from whatever the
  # temperature happens to be at that instant. Only an actual day change, or
  # an explicit edit of a schedule tunable (see number: below, each resets
  # this to -1 on_value), should trigger a recompute.
  - id: sched_computed_day
    type: int
    restore_value: true
    initial_value: '-1'
  - id: sched_block1_start
    type: time_t
    restore_value: true
    initial_value: '0'
  - id: sched_block1_end
    type: time_t
    restore_value: true
    initial_value: '0'
  - id: sched_block2_start
    type: time_t
    restore_value: true
    initial_value: '0'
  - id: sched_block2_end
    type: time_t
    restore_value: true
    initial_value: '0'
  # Today's sunset -- cached alongside the blocks above (same recompute,
  # same restore_value: true reasoning) purely so Part 3's hot-night
  # keep-alive can tell overnight apart from daytime without re-querying the
  # sun component every tick. sched_block1_start doubles as today's sunrise
  # for that same check (see Part 1). 0 means "not computed yet" -- gates
  # the keep-alive off until the first successful recompute.
  - id: sched_sunset
    type: time_t
    restore_value: true
    initial_value: '0'
  # When the plan above was last successfully (re)computed -- day-rollover
  # or the "Recompute Schedule Now" button, see Part 1 in evaluate_speed.
  # Restored like the block boundaries themselves: a real historical fact,
  # not something to erase to 0 on every reboot.
  - id: sched_last_recompute
    type: time_t
    restore_value: true
    initial_value: '0'
  # "What the autonomous plan alone says right now" -- kept live every
  # evaluate_speed tick regardless of freeze protection / manual override, so
  # a dashboard can show true plan-vs-actual divergence. Deliberately NOT
  # restored: it's fully recomputed every tick (at most 30s stale), so
  # there's nothing here worth persisting across a reboot.
  - id: sched_speed_now
    type: std::string
    restore_value: false
    initial_value: '"Off"'
  # "When's the next boost pulse" -- also fully recomputed every
  # evaluate_speed tick (Part 2b), also deliberately NOT restored for the
  # same reason as sched_speed_now above. 0 means "none left today".
  - id: sched_next_boost_start
    type: time_t
    restore_value: false
    initial_value: '0'
  - id: sched_next_boost_end
    type: time_t
    restore_value: false
    initial_value: '0'
  # "When will the plan's commanded speed next actually change" -- the
  # earliest still-upcoming boundary among today's block starts/ends and the
  # next boost pulse's own start/end (Part 2c). A dashboard-friendly single
  # answer to "when's the next change", rather than making the user compare
  # Block 1/2 Start/End and Next Boost Start/End by hand. Same conventions as
  # sched_next_boost_start/end above: fully recomputed every tick, not
  # restored, 0 means "no more changes scheduled today".
  - id: sched_next_change
    type: time_t
    restore_value: false
    initial_value: '0'
  # What sched_speed_now will become once sched_next_change arrives -- e.g.
  # "High" for a block's opening boost, "Off" for a block ending, "Medium"/
  # "High" for a mid-block boost pulse starting, "Low" for one ending.
  # Meaningless (left at "Off") when sched_next_change is 0 -- the display
  # sensor below gates on that instead of trusting this value in that case.
  - id: sched_next_planned_speed
    type: std::string
    restore_value: false
    initial_value: '"Off"'

binary_sensor:
  # Short name deliberately -- HA prefixes the device's own friendly name
  # ("Pool Controller") automatically, and naming this "Pool Controller
  # Status" here would risk HA generating a doubled-up entity ID.
  - platform: status
    name: "Status"
    device_class: connectivity

# A friendlier, HA-native "Fan" card layered on top of Manual Override: toggling
# it or picking a preset here just writes into `manual_override` below (same as
# using that select directly), so freeze protection and the schedule still take
# priority exactly as before. It has no way to represent "Auto" -- use the
# Manual Override select for that -- but covers the everyday "override to a
# speed" and "turn it off" cases with a nicer widget.
fan:
  - platform: template
    name: "Pump"
    id: pump_fan
    icon: mdi:pump
    preset_modes:
      - "Low"
      - "Medium"
      - "High"
    on_state:
      - lambda: |-
          if (id(syncing_fan_display)) return;
          // See esphome: on_boot: above -- this entity boots into a
          // default "off" state, and without this guard that boot-time
          // firing would immediately force Manual Override to "Off",
          // overriding its own "Auto" boot default before anyone gets a
          // chance to see it.
          if (id(boot_guard_active)) return;
          if (!x->state) {
            id(manual_override).make_call().set_option("Off").perform();
          } else if (x->has_preset_mode()) {
            id(manual_override).make_call().set_option(x->get_preset_mode().str()).perform();
          } else {
            // Turned on with no preset chosen (e.g. a plain toggle) -- default low.
            id(manual_override).make_call().set_option("Low").perform();
          }

# --- Pump speed relays, driven directly via GPIO through an opto-isolated
# 8-channel relay module (Elegoo-style). This board is active-LOW -- pulling
# an IN pin low is what closes the relay -- hence `inverted: true` on each
# pin below; ESPHome's `switch.turn_on` still means "logically on" from
# there. Internal (no HA entity): these are only ever driven through
# apply_speed's break-before-make sequencing below, never toggled directly,
# so exposing them individually in HA would let someone bypass that safety
# sequencing by accident.
switch:
  - platform: gpio
    id: relay_v1
    pin:
      number: ${relay_v1_pin}
      inverted: true
    restore_mode: ALWAYS_OFF
    internal: true
  - platform: gpio
    id: relay_v2
    pin:
      number: ${relay_v2_pin}
      inverted: true
    restore_mode: ALWAYS_OFF
    internal: true
  - platform: gpio
    id: relay_v3
    pin:
      number: ${relay_v3_pin}
      inverted: true
    restore_mode: ALWAYS_OFF
    internal: true
  - platform: gpio
    id: relay_run
    pin:
      number: ${relay_run_pin}
      inverted: true
    restore_mode: ALWAYS_OFF
    internal: true

script:
  # Run/Stop (relay_run) is only ever toggled to actually start or stop the
  # pump (Off <-> non-Off). Changing speed while already running (Low <->
  # Medium <-> High) never drops Run -- only the speed-select relay changes,
  # break-before-make, with Run left asserted throughout. The pump's own
  # controller treats a Run/Stop off->on transition as a fresh start and
  # forces 5 minutes at max power, so cycling Run on every speed/mode change
  # (as this used to do) meant every such change unintentionally triggered
  # that startup ritual.
  - id: apply_speed
    # Now that manual_override can trigger this instantly (on_value below)
    # instead of only every 30s, a rapid double-change could otherwise land
    # inside an in-flight run and get silently dropped (default mode:
    # single), leaving last_commanded claiming a speed the relays never
    # actually reached. restart cancels an in-progress run and starts the
    # new one instead.
    mode: restart
    parameters:
      speed: string
    then:
      - logger.log:
          format: "Pump: applying speed %s"
          args: ["speed.c_str()"]
      - if:
          condition:
            lambda: 'return speed == "Off";'
          then:
            # Stopping: drop Run first, settle, then clear all three speed
            # relays.
            - switch.turn_off: relay_run
            - delay: 500ms
            - switch.turn_off: relay_v1
            - switch.turn_off: relay_v2
            - switch.turn_off: relay_v3
          else:
            # Starting or changing speed: select the new speed relay
            # (break-before-make against the other two -- never two speed
            # DI lines closed together), then assert Run. If Run was already
            # on (a plain speed change), this re-assert is a no-op and the
            # pump never sees an off->on edge.
            - if:
                condition: {lambda: 'return speed == "Low";'}
                then:
                  - switch.turn_off: relay_v2
                  - switch.turn_off: relay_v3
                  - delay: 300ms
                  - switch.turn_on: relay_v1
            - if:
                condition: {lambda: 'return speed == "Medium";'}
                then:
                  - switch.turn_off: relay_v1
                  - switch.turn_off: relay_v3
                  - delay: 300ms
                  - switch.turn_on: relay_v2
            - if:
                condition: {lambda: 'return speed == "High";'}
                then:
                  - switch.turn_off: relay_v1
                  - switch.turn_off: relay_v2
                  - delay: 300ms
                  - switch.turn_on: relay_v3
            - delay: 300ms
            - switch.turn_on: relay_run

  # The schedule engine itself: computes today's autonomous filtration plan
  # (once per day, cached -- see globals above), derives what that plan says
  # right now, and applies the result of the freeze/override/schedule
  # priority chain if it's changed. Runs periodically (below) to catch the
  # freeze-protection/schedule/boost checks, which are purely time/
  # temperature driven and have no "changed" event to react to -- and also
  # runs immediately on manual_override's and the schedule tunables' on_value,
  # so changing any of them doesn't wait for up to 30s of polling.
  - id: evaluate_speed
    then:
      - lambda: |-
          // ===== Part 1: recompute today's autonomous (tier 3) plan, if stale =====
          if (id(local_time).now().is_valid()) {
            int today = id(local_time).now().day_of_year;
            if (today != id(sched_computed_day)) {
              float temp = id(pool_return_temp).state;
              // Only cache on success -- a recompute landing before
              // pool_return_temp's first post-boot reading (or a transient
              // sensor fault) shouldn't lock in a bad plan for the whole day;
              // it just retries next tick instead.
              if (!isnan(temp)) {
                float hours = clamp(temp / 2.0f, id(min_filtration_hours).state,
                                     id(max_filtration_hours).state)
                              + id(filtration_hour_offset).state;

                // "Today" at local midnight -- forces sunrise()/sunset() to
                // return TODAY's event even if called after it already
                // happened (they'd otherwise roll forward to tomorrow's).
                ESPTime midnight_today = id(local_time).now();
                midnight_today.hour = 0;
                midnight_today.minute = 0;
                midnight_today.second = 0;
                midnight_today.recalc_timestamp_local();

                auto sunrise = id(sun_id).sunrise(midnight_today, -0.833);
                auto sunset = id(sun_id).sunset(midnight_today, -0.833);

                if (sunrise.has_value() && sunset.has_value()) {
                  time_t noon = (sunrise->timestamp + sunset->timestamp) / 2;
                  // Fully evaluate each tunable's float offset into an
                  // integral number of seconds BEFORE combining with a
                  // (much larger) epoch timestamp -- adding a number
                  // template's float .state straight to a time_t implicitly
                  // converts the timestamp to float, which only has ~24 bits
                  // of mantissa and silently rounds to the nearest ~128s at
                  // today's epoch magnitude.
                  time_t warmest_offset_sec = (time_t) (id(warmest_offset_hours).state * 3600.0f);
                  time_t warmest = noon + warmest_offset_sec;

                  time_t total_sec = (time_t) (hours * 3600.0f);
                  time_t block1_len = total_sec / 3;
                  time_t block2_len = total_sec - block1_len;

                  time_t b1_start = sunrise->timestamp;
                  time_t b1_end = b1_start + block1_len;
                  time_t b2_start = warmest - block2_len / 2;
                  time_t b2_end = warmest + block2_len / 2;

                  // Merge into one continuous block if they'd touch or
                  // overlap -- guarantees exactly `hours` of total filtration
                  // either way. (A union of two overlapping windows can only
                  // be <= the sum of their lengths, so left un-merged it
                  // would UNDER-shoot the temperature-derived budget the more
                  // they overlap, never exceed it -- merging is still the
                  // right call, just for that reason.)
                  if (b2_start <= b1_end) {
                    b1_end = b1_start + total_sec;
                    b2_start = b1_end;
                    b2_end = b1_end;
                  }

                  // Never spill into tomorrow -- the day-rollover recompute
                  // above would silently cut off and overwrite whatever
                  // tail ran past midnight with an unrelated new plan.
                  time_t midnight_end = midnight_today.timestamp + 86400;
                  if (b1_end > midnight_end) b1_end = midnight_end;
                  if (b2_start > midnight_end) b2_start = midnight_end;
                  if (b2_end > midnight_end) b2_end = midnight_end;

                  id(sched_block1_start) = b1_start;
                  id(sched_block1_end) = b1_end;
                  id(sched_block2_start) = b2_start;
                  id(sched_block2_end) = b2_end;
                  // Today's real sunset, cached alongside the blocks above
                  // purely so Part 3's hot-night keep-alive can tell
                  // overnight apart from daytime without re-querying the
                  // sun component every tick. b1_start doubles as today's
                  // sunrise for that same check -- it's never altered after
                  // being set to sunrise->timestamp above, merge/midnight
                  // clamping only ever touches the *end* boundaries.
                  id(sched_sunset) = sunset->timestamp;
                  id(sched_computed_day) = today;
                  // Stamped on every successful recompute (day-rollover or
                  // the "Recompute Schedule Now" button) -- exists purely so
                  // a press is confirmable even when the resulting plan is
                  // byte-for-byte identical to before (e.g. filtration hours
                  // still clamped at the same Max Filtration Hours ceiling).
                  // Without this there's no way to tell "recomputed, landed
                  // on the same plan" apart from "did nothing."
                  id(sched_last_recompute) = id(local_time).now().timestamp;
                }
                // else: sun lookup failed -- leave sched_computed_day alone,
                // retry next tick.
              }
            }
          }

          // ===== Part 2: "what the plan alone says right now" -- always
          // live, independent of freeze protection / manual override, so a
          // dashboard can show true plan-vs-actual divergence. =====
          time_t now_ts = id(local_time).now().timestamp;

          // Factored out so Part 2d below can reuse the exact same rules to
          // answer "what will the plan say at some future instant" (the next
          // change's target speed) -- rather than hand-deriving speed-
          // transition rules per candidate type, which would drift out of
          // sync with this the moment either one changed. Same >= / <
          // boundary semantics as this "now" evaluation, so calling it with
          // a transition timestamp itself correctly yields the state just
          // after that transition.
          auto plan_at = [&](time_t t) -> std::string {
            bool in_block = false;
            time_t block_start = 0;
            if (t >= id(sched_block1_start) && t < id(sched_block1_end)) {
              in_block = true;
              block_start = id(sched_block1_start);
            } else if (t >= id(sched_block2_start) && t < id(sched_block2_end)) {
              in_block = true;
              block_start = id(sched_block2_start);
            }

            std::string p = "Off";
            if (in_block) {
              p = "Low";
              // Every boost_interval_minutes, spend the first
              // boost_duration_minutes at an elevated speed -- anchored to
              // when this block started, so it's deterministic across
              // reboots rather than free-running on the wall clock. Most
              // pulses run at Medium; every boost_high_every_n-th pulse
              // (0-indexed, so the block's very first pulse is always one of
              // them) escalates to High instead, preserving the "every block
              // starts with a full boost" guarantee from before this was
              // split into two tiers.
              time_t boost_interval_sec = (time_t) (id(boost_interval_minutes).state * 60.0f);
              time_t boost_duration_sec = (time_t) (id(boost_duration_minutes).state * 60.0f);
              if (boost_interval_sec > 0) {
                time_t elapsed = t - block_start;
                time_t phase = elapsed % boost_interval_sec;
                if (phase < boost_duration_sec) {
                  int every_n = (int) id(boost_high_every_n).state;
                  long pulse_index = elapsed / boost_interval_sec;
                  p = (pulse_index % every_n == 0) ? "High" : "Medium";
                }
              }
            }
            return p;
          };

          std::string plan = plan_at(now_ts);
          id(sched_speed_now) = plan;

          // ===== Part 2b: "when's the next boost pulse" -- a look-ahead for
          // the dashboard, independent of Part 2 above (which only ever
          // evaluates the single instant "now"). Walks forward through
          // today's remaining blocks and finds the next boost window
          // (Medium or High, whichever evaluate_speed's Part 2 would pick);
          // leaves both globals at 0 if none remain today (already-past
          // blocks, boost pulses disabled via a zero interval/duration, or
          // the plan hasn't been computed yet). If "now" is itself inside a
          // pulse, next_boost_start/end deliberately skip past it to the
          // *following* cycle -- that's the right answer for "next boost
          // pulse" on the dashboard -- but that means the current pulse's
          // own end (the drop back to Low) needs to be captured separately,
          // below, so Part 2c doesn't lose track of it.
          time_t next_boost_start = 0;
          time_t next_boost_end = 0;
          time_t current_boost_end = 0;
          time_t look_interval_sec = (time_t) (id(boost_interval_minutes).state * 60.0f);
          time_t look_duration_sec = (time_t) (id(boost_duration_minutes).state * 60.0f);
          if (look_interval_sec > 0 && look_duration_sec > 0) {
            time_t blocks[2][2] = {
              {id(sched_block1_start), id(sched_block1_end)},
              {id(sched_block2_start), id(sched_block2_end)},
            };
            for (int b = 0; b < 2; b++) {
              time_t b_start = blocks[b][0];
              time_t b_end = blocks[b][1];
              if (b_end <= b_start) continue;  // zero-width (merged-away) block
              time_t candidate;
              if (now_ts < b_start) {
                candidate = b_start;  // a block's first pulse starts right on its boundary
              } else if (now_ts < b_end) {
                time_t phase = (now_ts - b_start) % look_interval_sec;
                // Same >= / < boundary semantics as plan_at() above: if
                // we're currently within the boosted portion of this pulse,
                // record when it drops back to Low so Part 2c can see it.
                if (phase < look_duration_sec) {
                  current_boost_end = now_ts - phase + look_duration_sec;
                  if (current_boost_end > b_end) current_boost_end = b_end;
                }
                candidate = now_ts - phase + look_interval_sec;
              } else {
                continue;  // this block is already over -- try the next one
              }
              if (candidate < b_end) {
                next_boost_start = candidate;
                next_boost_end = candidate + look_duration_sec;
                if (next_boost_end > b_end) next_boost_end = b_end;
                break;
              }
              // else: no more pulses fit before this block ends -- try the next block.
            }
          }
          id(sched_next_boost_start) = next_boost_start;
          id(sched_next_boost_end) = next_boost_end;

          // ===== Part 2c: "when's the next speed change, period" -- the
          // earliest still-upcoming boundary among today's block starts/
          // ends and the boost pulse start/end/current-pulse-end just
          // computed above. Covers Off->Low (a block starting), Low->Off (a
          // block ending, unless merged into the other block), the
          // Low<->Medium/High boost transitions Part 2b already found, and
          // -- via current_boost_end -- Medium/High->Low when "now" is
          // itself mid-pulse (otherwise this would skip straight to the
          // *following* pulse's start, showing the next bump instead of the
          // current one ending). Like sched_speed_now and
          // sched_next_boost_start/end, this reflects the autonomous plan
          // alone -- it keeps advancing even under freeze protection or a
          // manual override, same reasoning as those.
          time_t candidates[7] = {
            id(sched_block1_start), id(sched_block1_end),
            id(sched_block2_start), id(sched_block2_end),
            next_boost_start, next_boost_end,
            current_boost_end,
          };
          time_t next_change = 0;
          for (time_t c : candidates) {
            if (c > now_ts && (next_change == 0 || c < next_change)) {
              next_change = c;
            }
          }
          id(sched_next_change) = next_change;

          // ===== Part 2d: "what speed is that change going to" -- evaluate
          // the same plan_at() used for "now" above, but at the upcoming
          // transition instant itself. Correct by construction for every
          // transition kind (a block starting straight into its boost, a
          // block ending to Off, a boost pulse starting/ending mid-block)
          // without hand-listing rules per candidate, and can't drift out of
          // sync with Part 2's own "now" logic since it's the same function.
          id(sched_next_planned_speed) = (next_change != 0) ? plan_at(next_change) : "Off";

          // ===== Part 3: priority chain, highest wins. =====
          std::string desired = "Off";

          // 1. Freeze protection always wins, Home Assistant or not.
          if (id(pool_return_temp).state < 3.0) {
            desired = "Low";
          }
          // 2. Manual override (set from the HA dashboard) wins over the
          // schedule. Note sched_speed_now (and "Pump Planned Speed") keep
          // evolving normally even while overridden -- that's what makes the
          // plan-vs-actual divergence visible on a dashboard.
          else if (id(manual_override).current_option() != "Auto") {
            desired = id(manual_override).current_option().str();
          }
          // 3. Otherwise, whatever the autonomous plan says right now.
          else {
            desired = id(sched_speed_now);

            // 4. Hot-night keep-alive: outside both scheduled windows (the
            // plan above is Off) and overnight -- before today's sunrise or
            // after today's sunset -- keep circulating at Low instead of
            // sitting idle if the water's still warm. Deliberately Low
            // only, never boosted: boost pulses are timed from a block's
            // own start (see plan_at above), and this on purpose isn't a
            // block, so there's no anchor to pulse from -- the whole point
            // of this tier is a steady, bump-free overnight trickle, not a
            // scaled-down daytime block. Gated on sched_sunset != 0 so it
            // can't misfire before the very first daily recompute has ever
            // run (both sched_sunset and sched_block1_start default to 0
            // until then, which would otherwise look like "always night").
            // Deliberately keyed off the live temperature reading, not a
            // cached daily value like the blocks above -- unlike filtration
            // hours, this has to track the water actually cooling below 28
            // and stop the same tick it does, not hold a stale "still hot"
            // verdict from this morning's recompute for the rest of the day.
            if (desired == "Off" && id(sched_sunset) != 0) {
              bool is_overnight = now_ts < id(sched_block1_start) || now_ts >= id(sched_sunset);
              if (is_overnight && id(pool_return_temp).state > 28.0) {
                desired = "Low";
              }
            }
          }

          if (desired != id(last_commanded)) {
            id(last_commanded) = desired;

            id(syncing_fan_display) = true;
            if (desired == "Off") {
              id(pump_fan).turn_off().perform();
            } else {
              id(pump_fan).turn_on().set_preset_mode(desired.c_str()).perform();
            }
            id(syncing_fan_display) = false;

            id(apply_speed).execute(desired);
          }

interval:
  - interval: 30s
    then:
      - script.execute: evaluate_speed
