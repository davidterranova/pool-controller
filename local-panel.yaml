script:
  # Every text of every screen, in the panel's language: on boot, on a Panel Language change, every 5 s, and
  # after Apply. A label is only touched when its text changes, so LVGL redraws what changed.
  - id: panel_refresh
    mode: queued
    max_runs: 2
    then:
      - lambda: |-
          using namespace panel_ui;
          const Lang L = current_lang;
          auto set = [](lv_obj_t *o, const std::string &s) {
            if (std::strcmp(lv_label_get_text(o), s.c_str()) != 0)
              lv_label_set_text(o, s.c_str());
          };
          auto show = [](lv_obj_t *o, bool on) {
            lv_obj_set_hidden(o, !on);
          };

          // The clock now, if any.
          int now_minute = -1, now_second = 0;
          uint32_t this_month = 0;
          auto now = id(local_time).now();
          if (now.is_valid()) {
            now_minute = now.hour * 60 + now.minute;
            now_second = now.second;
            this_month = now.year * 100u + now.month;
          }

          // ---- the status bar
          set(id(panel_clock), clock(now_minute, L));
          bool wifi = !id(panel_wifi_ip).state.empty();
          set(id(panel_badge_freeze), T("panel.home.badge.freeze"));
          set(id(panel_badge_fill), T("panel.home.badge.fill_alarm"));
          set(id(panel_badge_wifi), T("panel.home.badge.no_wifi"));
          show(id(panel_badge_freeze), freeze_active(id(pool_return_temp).state, id(freeze_protection_c).state));
          show(id(panel_badge_fill), id(fill_meter_enabled) && id(fill_too_long_sensor).state);
          show(id(panel_badge_wifi), !wifi);
          lv_obj_set_style_text_color(id(panel_wifi_icon), lv_color_hex(wifi ? 0x1565C0 : 0xA9B4BF), 0);

          // ---- the mode card
          Mode mode;
          mode_from_option(id(manual_override).current_option().c_str(), mode);
          int next_minute = -1;
          if (id(sched_next_change) != 0) {
            auto at = ESPTime::from_epoch_local(id(sched_next_change));
            next_minute = at.hour * 60 + at.minute;
          }
          OverrideTime t = override_time(id(override_since_ms), millis(), id(manual_override_timeout_minutes).state);
          set(id(panel_mode_name), mode == AUTO ? T("common.mode.auto") : T("common.mode.manual"));
          set(id(panel_mode_line), mode_line(mode, id(last_commanded), next_minute, t, now_minute, now_second, L));
          set(id(panel_change_label), T("panel.home.change"));

          // ---- the tiles
          const char *celsius = T("panel.unit.celsius"), *litre = T("panel.unit.litre");
          set(id(panel_water_name), T("panel.home.tile.water"));
          set(id(panel_pad_name), T("panel.home.tile.pad"));
          set(id(panel_outdoor_name), T("panel.home.tile.outdoor"));
          set(id(panel_fill_today_name), T("panel.home.tile.fill_today"));
          set(id(panel_fill_month_name), T("panel.home.tile.fill_month"));
          set(id(panel_water_value), quantity(id(pool_return_temp).state, 1, celsius, L));
          set(id(panel_pad_value), quantity(id(pad_ambient_temp).state, 1, celsius, L));
          set(id(panel_outdoor_value), quantity(id(outdoor_temp).state, 1, celsius, L));
          bool fill_on = id(fill_meter_enabled);
          show(id(panel_fill_today_tile), fill_on);
          show(id(panel_fill_month_tile), fill_on);
          float today_l = id(fill_today_sensor).state;
          set(id(panel_fill_today_value), quantity(today_l, 0, litre, L));
          set(id(panel_fill_month_value),
              quantity(fill_month(id(fill_months_key), id(fill_months)[0], today_l, this_month), 0, litre, L));

          // ---- the sheet's fixed texts (panel_sheet_draw sets what it stages)
          set(id(panel_sheet_title), T("panel.sheet.title"));
          set(id(panel_sheet_auto_label), mode_label(AUTO, L));
          set(id(panel_sheet_off_label), mode_label(OFF, L));
          set(id(panel_sheet_low_label), mode_label(LOW, L));
          set(id(panel_sheet_medium_label), mode_label(MEDIUM, L));
          set(id(panel_sheet_high_label), mode_label(HIGH, L));
          set(id(panel_sheet_for), T("panel.sheet.for"));
          set(id(panel_sheet_30_label), duration(DURATIONS[0] * 60u, L));
          set(id(panel_sheet_60_label), duration(DURATIONS[1] * 60u, L));
          set(id(panel_sheet_120_label), duration(DURATIONS[2] * 60u, L));
          set(id(panel_sheet_never_label), T("common.never"));
          set(id(panel_sheet_cancel_label), T("common.cancel"));
          set(id(panel_sheet_apply_label), T("common.apply"));
          if (panel_ui::sheet.is_open())
            set(id(panel_sheet_hint), panel_ui::sheet.hint_text(now_minute, now_second, L));

          // ---- status
          set(id(panel_status_title), T("panel.status.title"));
          set(id(panel_status_back_label), T("panel.status.back"));
          set(id(panel_st_network_name), T("panel.status.network"));
          set(id(panel_st_signal_name), T("panel.status.signal"));
          set(id(panel_st_ip_name), T("panel.status.ip"));
          set(id(panel_st_version_name), T("panel.status.version"));
          set(id(panel_st_uptime_name), T("panel.status.uptime"));
          set(id(panel_st_update_name), T("panel.status.update.label"));
          set(id(panel_st_setup_name), T("panel.status.setup.label"));
          set(id(panel_st_scan), T("panel.status.scan"));
          set(id(panel_st_network), wifi ? id(panel_wifi_ssid).state : std::string(T("panel.status.not_connected")));
          set(id(panel_st_signal), quantity(wifi ? id(panel_wifi_rssi).state : NAN, 0, T("panel.unit.dbm"), L));
          set(id(panel_st_ip), wifi ? id(panel_wifi_ip).state : unknown(L));
          set(id(panel_st_version), id(firmware_version_text).has_state() ? id(firmware_version_text).state : unknown(L));
          set(id(panel_st_uptime), uptime_text(id(uptime_sensor).state, L));
          set(id(panel_st_update), update_text(id(update_status).state, L));
          set(id(panel_st_setup), setup_text(id(setup_state).state, L));
          static std::string qr_text;
          std::string url = wifi ? "http://" + id(panel_wifi_ip).state + "/" : "";
          if (url != qr_text) {
            qr_text = url;
            if (!url.empty())
              lv_qrcode_update(id(panel_st_qr), url.c_str(), url.size());
          }
          show(id(panel_st_qr), wifi);
          show(id(panel_st_scan), wifi);

  # The sheet's buttons and hint, from what it stages.
  - id: panel_sheet_draw
    then:
      - lambda: |-
          using namespace panel_ui;
          const Sheet &s = panel_ui::sheet;
          lv_obj_t *modes[MODE_COUNT] = {id(panel_sheet_auto), id(panel_sheet_off), id(panel_sheet_low),
                                         id(panel_sheet_medium), id(panel_sheet_high)};
          for (int i = 0; i < MODE_COUNT; i++)
            lv_obj_set_state(modes[i], LV_STATE_CHECKED, s.mode() == i);
          lv_obj_t *durations[DURATION_COUNT] = {id(panel_sheet_30), id(panel_sheet_60), id(panel_sheet_120),
                                                 id(panel_sheet_never)};
          int choice = s.minutes_choice();
          for (int i = 0; i < DURATION_COUNT; i++) {
            lv_obj_set_state(durations[i], LV_STATE_CHECKED, choice == i);
            lv_obj_set_state(durations[i], LV_STATE_DISABLED, !s.minutes_enabled());
          }
          int now_minute = -1, now_second = 0;
          auto now = id(local_time).now();
          if (now.is_valid()) {
            now_minute = now.hour * 60 + now.minute;
            now_second = now.second;
          }
          lv_label_set_text(id(panel_sheet_hint), s.hint_text(now_minute, now_second, current_lang).c_str());

  # Change: the sheet opens on the current mode and the current Manual Override Timeout.
  - id: panel_open_sheet
    then:
      - lambda: |-
          panel_ui::Mode mode;
          panel_ui::mode_from_option(id(manual_override).current_option().c_str(), mode);
          panel_ui::sheet.open(mode, id(manual_override_timeout_minutes).state);
          ESP_LOGI("panel", "Sheet open on %s, %.0f min", panel_ui::mode_option(mode),
                   id(manual_override_timeout_minutes).state);
      - script.execute: panel_sheet_draw
      - lvgl.page.show: panel_sheet_page

  # Cancel (and Apply, once written): nothing staged survives.
  - id: panel_close_sheet
    then:
      - lambda: 'panel_ui::sheet.discard();'
      - lvgl.page.show: panel_home

  # Apply: Manual Override Timeout first (not for Auto), then Manual Override, as the dashboard writes them. The
  # firmware does the rest: its expiry, « Manual Override Ends At », the alert, freeze protection's priority.
  - id: panel_apply
    then:
      - lambda: |-
          if (!panel_ui::sheet.is_open()) return;
          panel_ui::Writes w = panel_ui::sheet.apply();
          if (w.set_timeout) {
            ESP_LOGI("panel", "Apply: Manual Override Timeout %u min", (unsigned) w.timeout_min);
            auto call = id(manual_override_timeout_minutes).make_call();
            call.set_value(w.timeout_min);
            call.perform();
          }
          ESP_LOGI("panel", "Apply: Manual Override %s", w.override_option);
          auto call = id(manual_override).make_call();
          call.set_option(w.override_option);
          call.perform();
      - lvgl.page.show: panel_home
      - script.execute: panel_refresh

  - id: panel_show_status
    then:
      - script.execute: panel_refresh
      - lvgl.page.show: panel_status_page

  # After Panel Sleep After with no touch.
  - id: panel_sleep
    then:
      - lambda: |-
          bool staged = panel_ui::sheet.is_open();
          panel_ui::sheet.discard();
          ESP_LOGI("panel", "Sleep after %u s with no touch%s", (unsigned) id(panel_sleep_s),
                   staged ? ": the sheet is discarded" : "");
      - lvgl.page.show: panel_home
      - light.turn_off: panel_backlight
      - lvgl.pause:

  # The Auto button's press: the hardware block has set Auto already.
  - id: panel_auto_button
    then:
      - lambda: |-
          if (panel_ui::sheet.is_open())
            ESP_LOGI("panel", "Auto button: the sheet is discarded");
          panel_ui::sheet.discard();
          // Restarts on_idle's count: without it, a screen woken by the button would never sleep again.
          lv_display_trigger_activity(nullptr);
      - lvgl.page.show: panel_home
      - if:
          condition: lvgl.is_paused
          then:
            - logger.log: {level: INFO, tag: panel, format: "Auto button: wakes the screen"}
            - lvgl.resume:
      - script.execute: panel_refresh

  # A setting saved now, not at the next flash write (5 min).
  - id: panel_settings_save
    mode: restart
    then:
      - delay: 2s
      - lambda: 'global_preferences->sync();'

interval:
  - interval: 5s
    then:
      - script.execute: panel_refresh
