            width: 86
            height: 58
            checkable: true
            on_click:
              - lambda: 'panel_ui::sheet.choose_mode(panel_ui::HIGH);'
              - script.execute: panel_sheet_draw
            widgets:
              - label: {id: panel_sheet_high_label, align: center, text_font: panel_font_s, text: ""}
        - label: {id: panel_sheet_for, x: 12, y: 104, styles: panel_name, text: ""}
        - button:
            id: panel_sheet_30
