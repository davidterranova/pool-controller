        - button:
            id: panel_sheet_medium
            x: 288
            y: 38
            width: 86
            height: 58
            checkable: true
            on_click:
              - lambda: 'panel_ui::sheet.choose_mode(panel_ui::MEDIUM);'
              - script.execute: panel_sheet_draw
