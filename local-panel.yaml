# The touch panel (ESP32-S3 build; docs/plans/s3-panel.md): run the pool from the box, without a phone.
# pool-controller-s3.yaml includes it as a package, and so does the preview (tools/panel-preview/), so it names its
# hardware only by id: panel_display (the ST7796), panel_touch (the FT6336U), panel_backlight and auto_button come
# from the S3's hardware block, or from the preview's stand-ins. So do panel_wifi_ssid, panel_wifi_ip and
# panel_wifi_rssi (the Wi-Fi as the panel shows it: the host build has no Wi-Fi component). Everything else it reads
# is the controller's own, by its id in pool-controller.yaml and its packages: manual_override,
# manual_override_timeout_minutes, override_since_ms, last_commanded, sched_next_change, the probes
# (pool_return_temp, pad_ambient_temp, outdoor_temp), freeze_protection_c, fill_meter_enabled, fill_today_sensor,
# fill_months, fill_months_key, fill_too_long_sensor, uptime_sensor, firmware_version_text, update_status,
# setup_state, local_time.
#
# Screens (480×320, landscape):
#   Home     the status bar (the time, badges for freeze protection, a fill running too long and no Wi-Fi, the
#            Wi-Fi symbol; a tap opens Status), the mode card (Auto: the speed now and the next change, « Medium
#            until 16:00 »; manual: « High · 1 h 12 min left · Auto at 15:32 » or « no time limit ») with Change,
#            and five tiles: Water, Equipment pad, Outdoor, Fill today, Fill this month (the fill row is hidden
#            while Fill Meter is off; a tile with no reading shows « — »).
#   Sheet    the pump mode: Auto · Off · Low · Medium · High, then « For » 30 min · 1 h · 2 h · Never (disabled
#            for Auto), a hint (panel_ui.h's Sheet), Cancel · Apply. It opens on the current mode and the current
#            Manual Override Timeout. Apply writes what the dashboard writes: Manual Override Timeout first, then
#            Manual Override (Auto: Manual Override only), and logs both, in order.
#   Status   Wi-Fi network, signal, IP address with a QR code of the page's address, firmware version, uptime,
#            Update Status and Setup State (their codes, translated). Back returns home.
#
# Behaviour:
#   - After Panel Sleep After with no touch: the sheet is discarded, Home is shown, the backlight goes off and LVGL
#     pauses (on_idle).
#   - A touch on a sleeping screen only wakes it: LVGL hands no widget a touch while paused, and resumes on its
#     release (resume_on_input). It is counted (Panel Ignored Touches); a burst logs a warning (panel_ui.h's
#     TouchGuard: condensation shows as touches nobody made).
#   - The Auto button: the S3's hardware block sets Auto (it works whatever the panel does); here it also discards
#     the sheet, shows Home and wakes the screen.
#   - Panel Language relabels every widget at once.
#   - Every text is redrawn every 5 s (the readings, the time left), on a language change, and after Apply.
#   - Log tag `panel`: wake, sleep, every Apply with what it wrote, the Auto button, ignored touches and bursts.
#
# Texts: every one through panel_ui.h's T() / tr_prefix() from panel_i18n.h, never a literal
# (.claude/rules/translations.md). panel_i18n.h is generated from i18n-panel/{en,fr,es}.json: make panel-i18n.
#
# Entities (names are English and never renamed once published):
#   Panel Language          select, config: en, fr, es (codes; the page shows the languages' names)
#   Panel Sleep After       number, config: 15–600 s, step 15, default 60
#   Panel Ignored Touches   sensor, diagnostic: touches that only woke the screen, since boot
# Stable globals, never renamed (an NVS key is the md5 of its global's id):
#   panel_lang     uint8_t (panel_i18n::Lang), default en
#   panel_sleep_s  uint16_t, seconds, default 60

esphome:
  # A list: pool-controller.yaml has its own. panel_ui.h includes panel_i18n.h, so both are copied.
  includes:
    - panel_i18n.h
    - panel_ui.h
  on_boot:
    # After the globals are restored, before the first draw.
    - priority: -100
      then:
        - lambda: |-
            panel_ui::set_lang((panel_i18n::Lang) id(panel_lang));
            panel_ui::on_missing = [](const char *key) { ESP_LOGW("panel", "no text for %s", key); };
            id(panel_language).publish_state(panel_ui::lang_code(panel_ui::current_lang));
            id(panel_sleep_after).publish_state(id(panel_sleep_s));
            id(panel_ignored_touches).publish_state(0);
        - script.execute: panel_refresh

globals:
  - id: panel_lang
    type: uint8_t
    restore_value: true
    initial_value: '0'
  - id: panel_sleep_s
    type: uint16_t
    restore_value: true
    initial_value: '60'

select:
  # The panel's language, as a code (en, fr, es): the page shows the languages' names (S5), and the setup wizard
  # sets it to the page's language. A change relabels the panel at once.
  - platform: template
    name: "Panel Language"
    id: panel_language
    icon: mdi:translate
    entity_category: config
    options: ["en", "fr", "es"]
    set_action:
      - lambda: |-
          panel_ui::set_lang(panel_ui::lang_from_code(x.c_str()));
          id(panel_lang) = panel_ui::current_lang;
          id(panel_language).publish_state(x);
          ESP_LOGI("panel", "Panel Language: %s", x.c_str());
      - script.execute: panel_refresh
      - script.execute: panel_settings_save
  # The pump mode, whoever changes it (the sheet, the page, Home Assistant, the expiry, the Auto button): the
  # panel follows at once, not at its next 5 s refresh.
  - id: !extend manual_override
    on_value:
      - script.execute: panel_refresh

number:
  # How long the screen stays lit with no touch. A touch on a sleeping screen only wakes it.
  - platform: template
    name: "Panel Sleep After"
    id: panel_sleep_after
    icon: mdi:sleep
    entity_category: config
    unit_of_measurement: s
    device_class: duration
    mode: box
    min_value: 15
    max_value: 600
    step: 15
    lambda: 'return (float) id(panel_sleep_s);'
    set_action:
      - lambda: |-
          id(panel_sleep_s) = (uint16_t) lroundf(x);
          id(panel_sleep_after).publish_state(id(panel_sleep_s));
          ESP_LOGI("panel", "Panel Sleep After: %u s", (unsigned) id(panel_sleep_s));
      - script.execute: panel_settings_save

sensor:
  # Touches that only woke a sleeping screen, since boot. Condensation shows here first: touches nobody made.
  - platform: template
    name: "Panel Ignored Touches"
    id: panel_ignored_touches
    icon: mdi:gesture-tap
    entity_category: diagnostic
    state_class: total_increasing
    accuracy_decimals: 0
    update_interval: never

# The Auto button (the S3's hardware block sets Auto on its press): it also discards the sheet and wakes the screen.
binary_sensor:
  - id: !extend auto_button
    on_press:
      - script.execute: panel_auto_button

touchscreen:
  - id: !extend panel_touch
    on_touch:
      - if:
          condition: lvgl.is_paused
          then:
            - lambda: |-
                auto &g = panel_ui::touch_guard;
                bool burst = g.ignored(millis());
                ESP_LOGI("panel", "Touch while asleep: it only wakes the screen (%u since boot)", (unsigned) g.count());
                if (burst)
                  ESP_LOGW("panel", "%u touches within %u min while asleep: condensation on the glass?",
                           (unsigned) panel_ui::TouchGuard::BURST_COUNT,
                           (unsigned) (panel_ui::TouchGuard::BURST_WINDOW_MS / 60000));
                id(panel_ignored_touches).publish_state(g.count());

# Montserrat (LVGL's own face) with GF_Latin_Core, which holds every accent of the three languages, ° and …; plus
# ³ for m³. tools/i18n/panel-header.mjs reads these glyph sets: make panel-i18n fails when a text needs a character
# a font lacks. Three sizes: 16 (names, hints, badges), 20 (the mode line, buttons), 28 (readings).
font:
  - file: "gfonts://Montserrat"
    id: panel_font_s
    size: 16
    bpp: 4
    glyphsets: [GF_Latin_Core]
    glyphs: "³"
  - file: "gfonts://Montserrat"
    id: panel_font_m
    size: 20
    bpp: 4
    glyphsets: [GF_Latin_Core]
    glyphs: "³"
  - file:
      type: gfonts
      family: Montserrat
      weight: 600
    id: panel_font_l
    size: 28
    bpp: 4
    glyphsets: [GF_Latin_Core]
    glyphs: "³"

lvgl:
  displays: [panel_display]
  touchscreens: [panel_touch]
  default_font: panel_font_m
  bg_color: 0xF4F6F8
  text_color: 0x1F2933
  # Dims to nothing: the backlight off, LVGL paused. A touch only resumes it (resume_on_input, on by default).
  on_idle:
    - timeout: !lambda 'return (uint32_t) id(panel_sleep_s) * 1000u;'
      then:
        - script.execute: panel_sleep
  on_resume:
    - light.turn_on: panel_backlight
    - logger.log: {level: INFO, tag: panel, format: "Wake: backlight on"}
  style_definitions:
    - id: panel_card
      bg_color: 0xFFFFFF
      bg_opa: COVER
      radius: 12
      border_width: 0
      shadow_width: 0
      pad_all: 9
    - id: panel_badge
      radius: 10
      bg_opa: COVER
      pad_left: 8
      pad_right: 8
      pad_top: 2
      pad_bottom: 2
      text_color: 0xFFFFFF
      text_font: panel_font_s
    - id: panel_name
      text_font: panel_font_s
      text_color: 0x52606D
  theme:
    button:
      bg_color: 0xFFFFFF
      bg_opa: COVER
      border_color: 0xC9D1DA
      border_width: 2
      radius: 10
      shadow_width: 0
      text_color: 0x1F2933
      pad_all: 2
      pressed:
        bg_color: 0xDCE6F2
      checked:
        bg_color: 0x1565C0
        border_color: 0x1565C0
        text_color: 0xFFFFFF
      disabled:
        bg_color: 0xEEF1F4
        border_color: 0xE1E6EB
        text_color: 0xA9B4BF
  pages:
    # ------------------------------------------------------------------------------------------------------ home
    - id: panel_home
      scrollbar_mode: "OFF"
      widgets:
        # The status bar: a tap opens Status.
        - obj:
            id: panel_bar
            x: 0
            y: 0
            width: 480
            height: 38
            bg_opa: TRANSP
            border_width: 0
            radius: 0
            pad_all: 0
            clickable: true
            scrollbar_mode: "OFF"
            on_click:
              - script.execute: panel_show_status
            widgets:
              - label: {id: panel_clock, x: 12, y: 8, text_font: panel_font_m, text: ""}
              - obj:
                  x: 84
                  y: 6
                  width: 344
                  height: 28
                  bg_opa: TRANSP
                  border_width: 0
                  pad_all: 0
                  # A tap goes to the bar.
                  clickable: false
                  scrollbar_mode: "OFF"
                  layout:
                    type: flex
                    flex_flow: row
                    pad_column: 6
                    flex_align_cross: center
                  widgets:
                    - label: {id: panel_badge_freeze, styles: panel_badge, bg_color: 0x1E88E5, hidden: true, text: ""}
                    - label: {id: panel_badge_fill, styles: panel_badge, bg_color: 0xD9480F, hidden: true, text: ""}
                    - label: {id: panel_badge_wifi, styles: panel_badge, bg_color: 0x6B7785, hidden: true, text: ""}
              # LVGL's symbol font: its Wi-Fi sign, no text.
              - label: {id: panel_wifi_icon, x: 440, y: 9, text_font: montserrat_20, text: ""}
        # The mode card.
        - obj:
            x: 12
            y: 42
            width: 456
            height: 98
            styles: panel_card
            scrollbar_mode: "OFF"
            widgets:
              - label: {id: panel_mode_name, x: 0, y: 0, styles: panel_name, text: ""}
              - label: {id: panel_mode_line, x: 0, y: 22, width: 310, long_mode: wrap, text_font: panel_font_m, text: ""}
              - button:
                  id: panel_change
                  x: 316
                  y: 9
                  width: 120
                  height: 60
                  on_click:
                    - script.execute: panel_open_sheet
                  widgets:
                    - label: {id: panel_change_label, align: center, text_font: panel_font_m, text: ""}
        # The probes' tiles.
        - obj:
            x: 12
            y: 148
            width: 150
            height: 80
            styles: panel_card
            scrollbar_mode: "OFF"
            widgets:
              - label: {id: panel_water_name, x: 0, y: 0, width: 132, height: 20, long_mode: dot, styles: panel_name, text: ""}
              - label: {id: panel_water_value, align: bottom_left, x: 0, y: 0, text_font: panel_font_l, text: ""}
        - obj:
            x: 165
            y: 148
            width: 150
            height: 80
            styles: panel_card
            scrollbar_mode: "OFF"
            widgets:
              - label: {id: panel_pad_name, x: 0, y: 0, width: 132, height: 20, long_mode: dot, styles: panel_name, text: ""}
              - label: {id: panel_pad_value, align: bottom_left, x: 0, y: 0, text_font: panel_font_l, text: ""}
        - obj:
            x: 318
            y: 148
            width: 150
            height: 80
            styles: panel_card
            scrollbar_mode: "OFF"
            widgets:
              - label: {id: panel_outdoor_name, x: 0, y: 0, width: 132, height: 20, long_mode: dot, styles: panel_name, text: ""}
              - label: {id: panel_outdoor_value, align: bottom_left, x: 0, y: 0, text_font: panel_font_l, text: ""}
        # The fill tiles, hidden while Fill Meter is off.
        - obj:
            id: panel_fill_today_tile
            x: 12
            y: 234
            width: 225
            height: 80
            styles: panel_card
            scrollbar_mode: "OFF"
            widgets:
              - label: {id: panel_fill_today_name, x: 0, y: 0, width: 207, height: 20, long_mode: dot, styles: panel_name, text: ""}
              - label: {id: panel_fill_today_value, align: bottom_left, x: 0, y: 0, text_font: panel_font_l, text: ""}
        - obj:
            id: panel_fill_month_tile
            x: 243
            y: 234
            width: 225
            height: 80
            styles: panel_card
            scrollbar_mode: "OFF"
            widgets:
              - label: {id: panel_fill_month_name, x: 0, y: 0, width: 207, height: 20, long_mode: dot, styles: panel_name, text: ""}
              - label: {id: panel_fill_month_value, align: bottom_left, x: 0, y: 0, text_font: panel_font_l, text: ""}

    # ----------------------------------------------------------------------------------------- pump-mode sheet
    - id: panel_sheet_page
      scrollbar_mode: "OFF"
      widgets:
        - label: {id: panel_sheet_title, x: 12, y: 8, text_font: panel_font_m, text: ""}
        - button:
            id: panel_sheet_auto
            x: 12
            y: 38
            width: 86
            height: 58
            checkable: true
            on_click:
              - lambda: 'panel_ui::sheet.choose_mode(panel_ui::AUTO);'
              - script.execute: panel_sheet_draw
