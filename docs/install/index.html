<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="description" content="Install the pool controller's firmware on an ESP32, from the browser, over USB.">
<link rel="icon" href="data:,">
<title>Pool controller · Install</title>
<!--
  The install page (docs/plans/secret-free-firmware.md, WP7), served at the root of the project's GitHub Pages
  site, https://pool-controller.kitesize.fr/, beside /firmware/ (the release's manifest.json and images):
  .github/workflows/release.yml's pages job deploys this folder's contents there. ESP Web Tools does the
  install; install.js loads it, pinned, from unpkg where it can install (Chrome or Edge on a computer).

  In English, French and Spanish (docs/plans/i18n.md, I6): an element's text is the key in its data-i18n,
  an attribute's the key in data-i18n-<attribute>, both from i18n/<lang>.json (install-i18n.js); install.js
  fills them in the visitor's language, and again when the EN | FR | ES switch changes it. The title and the
  description above stay in English for search engines (a test keeps them equal to en.json's).
-->
<style>
/* Tokens: webui/app.css (Home Assistant's default theme + piscine-card's palette), light then dark. */
:root {
  color-scheme: light dark;
  --primary-color: #03a9f4;
  --primary-background-color: #fafafa;
  --card-background-color: #fff;
  --primary-text-color: #212121;
  --secondary-text-color: #727272;
  --divider-color: rgba(0, 0, 0, .12);
  --ha-card-border-radius: 12px;
  --ha-card-border-color: #e0e0e0;
  --acc: #0e86c4; --acc-soft: rgba(14, 134, 196, .14); --on-acc: #fff;
  --amber: #c98500; --amber-soft: rgba(227, 154, 6, .17);
  --cool: #2a72cf; --cool-soft: rgba(42, 114, 207, .13);
  --danger: #cc3a2f; --danger-soft: rgba(204, 58, 47, .12);
  --ok: #2e7d32; --ok-soft: rgba(46, 125, 50, .13);
  --idle: #858c94; --idle-soft: rgba(133, 140, 148, .17);
  --raised: rgba(127, 135, 145, .12); --line: rgba(127, 135, 145, .28);
  --shadow: 0 1px 2px rgba(20, 24, 30, .08);
}
@media (prefers-color-scheme: dark) {
  :root {
    --primary-background-color: #111111;
    --card-background-color: #1c1c1c;
    --primary-text-color: #e1e1e1;
    --secondary-text-color: #9b9b9b;
    --divider-color: rgba(225, 225, 225, .12);
    --ha-card-border-color: rgba(225, 225, 225, .12);
    --acc: #3fb0ec; --acc-soft: rgba(63, 176, 236, .18); --on-acc: #06202e;
    --amber: #f0b03a; --amber-soft: rgba(240, 176, 58, .17);
    --cool: #5f9dee; --cool-soft: rgba(95, 157, 238, .17);
    --danger: #ff6b60; --danger-soft: rgba(255, 107, 96, .15);
    --ok: #66bb6a; --ok-soft: rgba(102, 187, 106, .15);
    --idle: #8f969e; --idle-soft: rgba(143, 150, 158, .17);
    --raised: rgba(255, 255, 255, .07); --line: rgba(255, 255, 255, .12);
    --shadow: 0 1px 2px rgba(0, 0, 0, .35);
  }
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; min-height: 100vh;
  background: var(--primary-background-color); color: var(--primary-text-color);
  font: 14px/1.45 Roboto, system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
}
button, input, select { font: inherit; color: inherit; }
button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--acc); outline-offset: 2px; }
svg { display: block; fill: currentColor; }
a { color: var(--acc); }
code, .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: .92em; }
.muted { color: var(--secondary-text-color); }
.skip { position: absolute; left: -9999px; }
.skip:focus { left: 16px; top: 8px; z-index: 30; background: var(--card-background-color); padding: 8px 12px; border-radius: 8px; }
.sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
section:focus, .go:focus { outline: none; }

/* ---------- header (webui .top) */
.top { max-width: 1040px; margin: 0 auto; padding: 28px 16px 4px; display: flex; align-items: flex-end; gap: 12px; flex-wrap: wrap; }
.top .logo { width: 44px; height: 44px; flex: none; display: grid; place-items: center; border-radius: 50%; background: var(--acc-soft); color: var(--acc); align-self: center; }
.top .logo svg { width: 26px; height: 26px; }
.top .title { flex: 1; min-width: 200px; }
.top h1 { margin: 0; font-size: 24px; font-weight: 400; }
.top p { margin: 2px 0 0; color: var(--secondary-text-color); font-size: 15px; }
.chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 500; padding: 4px 10px 4px 8px;
  border-radius: 14px; background: var(--idle-soft); color: var(--idle); white-space: nowrap; text-decoration: none; }
.chip::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.chip.ok { background: var(--ok-soft); color: var(--ok); }
.chip.bad { background: var(--danger-soft); color: var(--danger); }
.chip.warn { background: var(--amber-soft); color: var(--amber); }
.side { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
/* the language switch: EN | FR | ES */
.lang { display: inline-flex; border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.lang button { border: 0; background: transparent; color: var(--secondary-text-color); cursor: pointer;
  font-size: 12px; font-weight: 500; letter-spacing: .04em; padding: 4px 10px; }
.lang button + button { border-left: 1px solid var(--line); }
.lang button:hover { color: var(--primary-text-color); }
.lang button[aria-pressed="true"] { background: var(--acc-soft); color: var(--acc); }
.lang button:focus-visible { outline-offset: -2px; }

main { max-width: 1040px; margin: 0 auto; padding: 8px 16px 32px; display: flex; flex-direction: column; gap: 16px; }
.lede { margin: 4px 4px 0; font-size: 15px; max-width: 72ch; }

/* ---------- ha-card look */
.card { background: var(--card-background-color); border: 1px solid var(--ha-card-border-color); border-radius: var(--ha-card-border-radius); min-width: 0; }
.card > h2 { margin: 0; padding: 16px 16px 4px; font-size: 20px; font-weight: 400; display: flex; align-items: center; gap: 10px; }
.card > h2 svg { width: 24px; height: 24px; flex: none; color: var(--secondary-text-color); }
.card .body { padding: 8px 16px 16px; }
.hint { margin: 0; font-size: 12px; color: var(--secondary-text-color); }
.sect { margin: 14px 0 4px; font-size: 12px; font-weight: 500; letter-spacing: .06em; text-transform: uppercase; color: var(--secondary-text-color); }

.cols { display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr); align-items: start; }
@media (min-width: 900px) { .cols { grid-template-columns: repeat(2, minmax(0, 1fr)); } }

/* ---------- buttons (webui .btn) */
.btn { height: 36px; padding: 0 16px; border-radius: 18px; border: 0; cursor: pointer; font-weight: 500; font-size: 14px;
  background: transparent; color: var(--acc); white-space: nowrap; display: inline-flex; align-items: center; gap: 8px; text-decoration: none; }
.btn:hover { background: var(--acc-soft); }
.btn.fill { background: var(--acc); color: var(--on-acc); }
.btn.fill:hover { filter: brightness(1.08); }
.btn.fill:disabled { background: var(--raised); color: var(--secondary-text-color); cursor: not-allowed; filter: none; }
.btn.line { border: 1px solid var(--line); }
.btn svg { width: 20px; height: 20px; }
.btn.big { height: 48px; padding: 0 24px 0 20px; border-radius: 24px; font-size: 16px; }
.btn.big svg { width: 22px; height: 22px; }

/* ---------- entity-like rows (webui .erow) */
.rows { display: flex; flex-direction: column; }
.erow { display: flex; align-items: flex-start; gap: 14px; padding: 8px 0; }
.erow .ic { width: 40px; height: 40px; flex: none; display: grid; place-items: center; color: var(--secondary-text-color); }
.erow .ic svg { width: 24px; height: 24px; }
.erow .name { flex: 1; min-width: 0; overflow-wrap: anywhere; padding-top: 9px; }
.erow .name > span { display: block; }
.erow .name small { display: block; font-size: 12px; line-height: 1.4; color: var(--secondary-text-color); margin-top: 2px; }
.stag { display: inline-block; margin-left: 6px; font-size: 11px; font-weight: 500; padding: 1px 8px; border-radius: 10px;
  background: var(--idle-soft); color: var(--idle); vertical-align: 1px; white-space: nowrap; }

/* ---------- boxes */
.dangerbox { background: var(--danger-soft); border-radius: 12px; padding: 12px 14px; display: grid; gap: 6px; font-size: 13px; }
.dangerbox b.h { color: var(--danger); font-weight: 500; font-size: 15px; display: flex; gap: 8px; align-items: center; }
.dangerbox b.h svg { width: 20px; height: 20px; flex: none; }
.dangerbox p { margin: 0; }
.box { border-radius: 12px; padding: 12px 14px; display: grid; gap: 6px; font-size: 13px; background: var(--raised); }
.box b.h { font-weight: 500; font-size: 14px; display: flex; gap: 8px; align-items: center; }
.box b.h svg { width: 20px; height: 20px; flex: none; }
.box p { margin: 0; }
.box.info { background: var(--cool-soft); }
.box.info b.h { color: var(--cool); }
.box.warn { background: var(--amber-soft); }
.box.warn b.h { color: var(--amber); }
.box.bad { background: var(--danger-soft); }
.box.bad b.h { color: var(--danger); }

/* ---------- the install card */
.install .body { display: grid; gap: 20px; grid-template-columns: minmax(0, 1fr); padding-top: 12px; }
@media (min-width: 900px) { .install .body { grid-template-columns: minmax(0, 5fr) minmax(0, 6fr); gap: 28px; } }
.act { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.go { display: flex; flex-direction: column; gap: 10px; align-items: flex-start; padding: 4px 0; }
.ver { font-size: 13px; color: var(--secondary-text-color); display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; }
.ver b { color: var(--primary-text-color); font-weight: 500; }
.ver a { text-decoration: none; font-weight: 500; display: inline-flex; gap: 3px; align-items: center; }
.ver a svg { width: 14px; height: 14px; }
.unsup { display: flex; gap: 12px; align-items: flex-start; }
.unsup .ic { width: 44px; height: 44px; flex: none; display: grid; place-items: center; border-radius: 50%; background: var(--amber-soft); color: var(--amber); }
.unsup .ic svg { width: 24px; height: 24px; }
.unsup b { display: block; font-size: 15px; font-weight: 500; }
.unsup p { margin: 2px 0 0; font-size: 13px; color: var(--secondary-text-color); }
.unsup .btn { margin-top: 8px; margin-left: -12px; }

/* numbered steps, the wizard's circles (webui .wz-steps .n) */
.steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; counter-reset: st; }
.steps > li { display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 12px; counter-increment: st; }
.steps > li::before { content: counter(st); width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center;
  background: var(--acc-soft); color: var(--acc); font-weight: 500; font-size: 13px; }
.steps > li > div { padding-top: 3px; min-width: 0; }
.steps small { display: block; font-size: 12px; color: var(--secondary-text-color); margin-top: 2px; }
.steps .k { margin: 0 1px; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12.5px; font-weight: 600; padding: 0 5px; border-radius: 5px;
  background: var(--raised); white-space: nowrap; }
.dlghead { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; margin: 0 0 10px; }
.dlghead b { font-size: 16px; font-weight: 500; }

/* the setup wizard's steps, as the controller's page draws them (webui .wz-steps) */
.wz-steps { list-style: none; margin: 10px 0 4px; padding: 0; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 4px; }
.wz-steps li { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11px; line-height: 1.2; color: var(--secondary-text-color);
  text-align: center; position: relative; }
.wz-steps li::before { content: ""; position: absolute; top: 13px; left: -50%; right: 50%; height: 2px; background: var(--line); }
.wz-steps li:first-child::before { display: none; }
.wz-steps .n { position: relative; width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center;
  background: linear-gradient(var(--raised), var(--raised)) var(--card-background-color); font-weight: 500; font-size: 13px; }
.wz-steps li:first-child .n { background: var(--acc); color: var(--on-acc); }
.wz-steps li:first-child { color: var(--primary-text-color); font-weight: 500; }

/* wiring table */
.pins { width: 100%; border-collapse: collapse; font-size: 13px; }
.pins th { text-align: left; font-size: 12px; font-weight: 500; color: var(--secondary-text-color); padding: 4px 8px 4px 0; border-bottom: 1px solid var(--divider-color); }
.pins td { padding: 6px 8px 6px 0; border-bottom: 1px solid var(--divider-color); vertical-align: top; }
.pins tr:last-child td { border-bottom: 0; }
.pins td:first-child { white-space: nowrap; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12.5px; width: 1%; padding-right: 14px; }
details.more { margin-top: 6px; }
details.more summary { cursor: pointer; color: var(--acc); font-weight: 500; font-size: 13px; padding: 6px 0; list-style: none; display: flex; gap: 6px; align-items: center; }
details.more summary::-webkit-details-marker { display: none; }
details.more summary::before { content: ""; width: 0; height: 0; border-left: 5px solid currentColor; border-top: 4px solid transparent; border-bottom: 4px solid transparent; transition: transform .15s; }
details.more[open] summary::before { transform: rotate(90deg); }
details.more[open] summary { margin-bottom: 4px; }

.links { display: flex; flex-wrap: wrap; gap: 4px 6px; margin-top: 4px; }
.links a { white-space: nowrap; overflow-wrap: normal; font-size: 12px; font-weight: 500; text-decoration: none; padding: 2px 8px; border-radius: 8px; background: var(--acc-soft); }
.ext { display: inline-flex; gap: 3px; align-items: center; font-weight: 500; text-decoration: none; }
.ext svg { width: 14px; height: 14px; }

footer { max-width: 1040px; margin: 0 auto; padding: 0 20px 40px; font-size: 12px; color: var(--secondary-text-color); display: flex; flex-wrap: wrap; gap: 4px 14px; }
footer a { color: inherit; }

.toast { position: fixed; left: 50%; bottom: 22px; transform: translate(-50%, 20px); opacity: 0; pointer-events: none; z-index: 40;
  background: #1f2328; color: #f3f4f6; border-radius: 12px; padding: 11px 15px; font-size: 13px; font-weight: 500;
  max-width: calc(100vw - 32px); transition: opacity .2s, transform .2s; box-shadow: 0 6px 20px rgba(0, 0, 0, .25); }
.toast.show { opacity: 1; transform: translate(-50%, 0); }
@media (prefers-color-scheme: dark) { .toast { background: #e7e9ec; color: #141619; } }
@media (max-width: 520px) {
  .top { padding-top: 18px; }
  .erow { gap: 10px; }
  .erow .ic { width: 32px; }
}
@media (prefers-reduced-motion: reduce) { * { transition-duration: .01ms !important; animation-duration: .01ms !important; } }

</style>
</head>
<body>
<a class="skip" href="#install" data-i18n="skip"></a>

<header class="top">
  <span class="logo" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M2,15C3.67,14.25 5.33,13.5 7,13.17V5A3,3 0 0,1 10,2C11.31,2 12.42,2.83 12.83,4H10A1,1 0 0,0 9,5V6H14V5A3,3 0 0,1 17,2C18.31,2 19.42,2.83 19.83,4H17A1,1 0 0,0 16,5V14.94C18,14.62 20,13 22,13V15C19.78,15 17.56,17 15.33,17C13.11,17 10.89,15 8.67,15C6.44,15 4.22,16 2,17V15M14,8H9V10H14V8M14,12H9V13C10.67,13.16 12.33,14.31 14,14.79V12M2,19C4.22,18 6.44,17 8.67,17C10.89,17 13.11,19 15.33,19C17.56,19 19.78,17 22,17V19C19.78,19 17.56,21 15.33,21C13.11,21 10.89,19 8.67,19C6.44,19 4.22,20 2,21V19Z"/></svg></span>
  <div class="title">
    <h1 data-i18n="header.title"></h1>
    <p data-i18n="header.subtitle"></p>
  </div>
  <div class="side">
    <span class="chip" id="verChip"></span>
    <!-- Each language by its own name (an autonym), the same whatever the page's language. -->
    <div class="lang" role="group" data-i18n-aria-label="lang.label">
      <button type="button" data-lang="en" lang="en" title="English" aria-label="English">EN</button>
      <button type="button" data-lang="fr" lang="fr" title="Fran&ccedil;ais" aria-label="Fran&ccedil;ais">FR</button>
      <button type="button" data-lang="es" lang="es" title="Espa&ntilde;ol" aria-label="Espa&ntilde;ol">ES</button>
    </div>
  </div>
</header>

<main>
  <p class="lede" data-i18n="lede"></p>

  <!-- ============================================================ Install -->
  <section class="card install" id="install" aria-labelledby="hInstall" tabindex="-1">
    <h2 id="hInstall"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15,7V11H16V13H13V5H15L12,1L9,5H11V13H8V10.93C8.7,10.56 9.2,9.85 9.2,9C9.2,7.78 8.21,6.8 7,6.8C5.78,6.8 4.8,7.78 4.8,9C4.8,9.85 5.3,10.56 6,10.93V13A2,2 0 0,0 8,15H11V18.05C10.29,18.41 9.8,19.15 9.8,20A2.2,2.2 0 0,0 12,22.2A2.2,2.2 0 0,0 14.2,20C14.2,19.15 13.71,18.41 13,18.05V15H16A2,2 0 0,0 18,13V11H19V7H15Z"/></svg><span data-i18n="install.title"></span></h2>
    <div class="body">
      <div class="act">
        <div class="dangerbox" role="note">
          <b class="h"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13 14H11V9H13M13 18H11V16H13M1 21H23L12 2L1 21Z"/></svg><span data-i18n="install.erase.title"></span></b>
          <p data-i18n="install.erase.new"></p>
          <p data-i18n="install.erase.never"></p>
        </div>

        <!-- The install action, one of: ESP Web Tools' button (Chrome or Edge on a computer), our note where
             installing isn't possible from here (#unsup: a phone, no Web Serial, no HTTPS), and under it the
             notices (#nofw: none published yet, manifest unreachable, ESP Web Tools not loaded). -->
        <div class="go" id="go" tabindex="-1">
          <esp-web-install-button manifest="firmware/manifest.json" id="ewt">
            <button slot="activate" class="btn fill big" id="installBtn" disabled>
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5,20H19V18H5M19,9H15V3H9V9H5L12,16L19,9Z"/></svg><span></span>
            </button>
          </esp-web-install-button>
          <div class="unsup" id="unsup" hidden></div>
          <!-- Without JavaScript nothing is translated (nor installable): this one note stays in English. -->
          <noscript><div class="box warn"><b class="h">JavaScript is turned off</b><p>Installing needs it: turn it on for this page.</p></div></noscript>
          <div id="nofw" hidden></div>
          <div class="ver" id="ver"></div>
          <p class="hint" id="goHint" data-i18n="install.hint"></p>
        </div>
      </div>

      <div>
        <p class="dlghead"><b data-i18n="dialog.title"></b><span class="hint" data-i18n="dialog.note"></span></p>
        <ol class="steps">
          <li><div><span data-i18n="dialog.port"></span>
            <small data-i18n="dialog.port_note"></small></div></li>
          <li><div><span data-i18n="dialog.install"></span>
            <small data-i18n="dialog.install_note"></small></div></li>
          <li><div data-i18n="dialog.wait"></div></li>
          <li><div><span data-i18n="dialog.wifi"></span>
            <small data-i18n="dialog.wifi_note"></small></div></li>
          <li><div><span data-i18n="dialog.visit"></span>
            <small data-i18n="dialog.visit_note"></small></div></li>
        </ol>
      </div>
    </div>
  </section>

  <div class="cols">
    <!-- ============================================================ What you need -->
    <section class="card" aria-labelledby="hNeed">
      <h2 id="hNeed"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2,10.96C1.5,10.68 1.35,10.07 1.63,9.59L3.13,7C3.24,6.8 3.41,6.66 3.6,6.58L11.43,2.18C11.59,2.06 11.79,2 12,2C12.21,2 12.41,2.06 12.57,2.18L20.47,6.62C20.66,6.72 20.82,6.88 20.91,7.08L22.36,9.6C22.64,10.08 22.47,10.69 22,10.96L21,11.54V16.5C21,16.88 20.79,17.21 20.47,17.38L12.57,21.82C12.41,21.94 12.21,22 12,22C11.79,22 11.59,21.94 11.43,21.82L3.53,17.38C3.21,17.21 3,16.88 3,16.5V10.96C2.7,11.13 2.32,11.14 2,10.96M12,4.15V4.15L12,10.85V10.85L17.96,7.5L12,4.15M5,15.91L11,19.29V12.58L5,9.21V15.91M19,15.91V12.69L14,15.59C13.67,15.77 13.3,15.76 13,15.6V19.29L19,15.91M13.85,13.36L20.13,9.73L19.55,8.72L13.27,12.35L13.85,13.36Z"/></svg><span data-i18n="need.title"></span></h2>
      <div class="body">
